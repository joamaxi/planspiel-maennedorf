<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planspiel Männedorf</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Planspiel" />
  <link rel="apple-touch-icon" href="./assets/pictos/neosight-192.png" />

  <style>
    :root {
      --color-accent: #1a5276;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #f0f4f8;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .start-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(26,82,118,0.12);
      padding: 60px 80px;
      text-align: center;
      max-width: 560px;
      width: 90%;
    }
    .start-card img.logo {
      height: 52px;
      width: auto;
      margin-bottom: 32px;
    }
    .start-card h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
      font-weight: 800;
      color: var(--color-accent);
    }
    .start-card p {
      color: #6b8fa8;
      font-size: 1rem;
      margin: 0 0 40px 0;
    }
    .btn-start {
      display: inline-block;
      padding: 14px 48px;
      background: var(--color-accent);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-start:hover  { background: #2e86c1; }
    .btn-start:active { transform: scale(0.97); }
  </style>
</head>

<body>
  <div class="start-card">
    <img
      src="./assets/logos/neosight-logo.png"
      alt="Neosight Logo"
      class="logo"
    />
    <h1>Planspiel<br>Spital Männedorf</h1>
    <p>Starte das Spiel, lade die Spielerdaten<br>und wähle dein Team aus.</p>
    <a class="btn-start" href="./screens/spz-00.html">Spiel starten →</a>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
