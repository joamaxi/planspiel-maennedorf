<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anfangsbilanz – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      padding: 50px 32px 24px 32px;
      display: flex;
      gap: 56px;
      align-items: flex-start;
    }

    /* ══ LINKE SPALTE ══════════════════════════════════════════════════════ */
    .col-left {
      width: 300px;
      flex-shrink: 0;
    }

    .decision-card {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 20px 28px 20px;
      background: #fff;
      margin-top: 60px;
    }

    .card-illustration {
      position: absolute;
      top: -28px;
      right: 12px;
      height: 55px;
      width: auto;
      display: block;
      background: #fff;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-accent);
      margin: 0 0 12px 0;
      line-height: 1.1;
    }

    .card-text {
      font-size: 0.86rem;
      color: #333;
      line-height: 1.6;
      margin: 0;
    }

    /* ══ RECHTE SPALTE ═════════════════════════════════════════════════════ */
    .col-right {
      flex: 1;
      min-width: 0;
    }

    /* ── Anfangsbilanz ─────────────────────────────────────────────────── */
    .bilanz-title {
      font-size: 1.9rem;
      font-weight: 300;
      color: #aaa;
      text-align: left;
      margin: 0 0 16px 20px;
      letter-spacing: 0.01em;
    }

    .bilanz-box {
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      display: flex;
      overflow: hidden;
    }

    .bilanz-col {
      flex: 1;
      padding: 18px 16px;
    }

    .bilanz-col + .bilanz-col {
      border-left: 1px solid var(--color-border-light);
    }

    .bilanz-col-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--color-accent);
      margin-bottom: 12px;
      padding-bottom: 6px;
    }

    /* Normale Zeile */
    .bl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid var(--color-border-light);
    }

    .bl-label {
      font-size: 0.80rem;
      color: var(--color-accent);
      flex: 1;
    }

    .bl-value {
      font-size: 0.80rem;
      font-weight: 600;
      color: #444;
      min-width: 44px;
      text-align: right;
      padding: 2px 4px;
    }

    /* Zwischensumme (Umlaufvermögen, Anlagevermögen, Fremdkapital) */
    .bl-row.subtotal {
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 6px;
    }
    .bl-row.subtotal .bl-label {
      font-weight: 700;
      color: var(--color-accent);
    }
    .bl-row.subtotal .bl-value {
      font-weight: 700;
      color: var(--color-accent);
    }

    /* Leerzeile als Abstand */
    .bl-spacer {
      height: 20px;
    }

    /* Total-Zeile */
    .bl-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 10px -16px -18px -16px;
      padding: 9px 16px;
      background: var(--color-sum-bg);
      border-top: 1px solid var(--color-border);
    }

    .bl-total .bl-label {
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--color-accent);
    }

    .bl-total .bl-value {
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--color-accent);
      min-width: 44px;
      text-align: right;
      padding: 2px 4px;
    }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="020-indexstart.html"
  data-next="040-aufgabe.html"
  data-spielzug-label="Spielzug 3"
  data-step-current="3"
  data-step-total="20"
  data-wirkung="00_wirkungen.png"
  data-disable-handbuch="true"
  data-disable-bank="true"
  data-disable-ereignis="true"
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- ══ LINKE SPALTE ══ -->
      <div class="col-left">
        <div class="decision-card">
          <img id="card-picto" src="../assets/pictos/picto_info.png"
               class="card-illustration" alt="" />
          <h1 class="card-title" id="card-title">Erklärung</h1>
          <p class="card-text" id="card-text"></p>
        </div>
      </div>

      <!-- ══ RECHTE SPALTE ══ -->
      <div class="col-right">

        <h2 class="bilanz-title">Anfangsbilanz</h2>

        <div class="bilanz-box">

          <!-- AKTIVA -->
          <div class="bilanz-col" id="col-aktiva">
            <div class="bilanz-col-header">AKTIVA</div>
            <!-- wird per JS befüllt -->
          </div>

          <!-- PASSIVA -->
          <div class="bilanz-col" id="col-passiva">
            <div class="bilanz-col-header">PASSIVA</div>
            <!-- wird per JS befüllt -->
          </div>

        </div>
      </div>
    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; }
    }

    /* ══ Spielaufgaben → linke Karte ══════════════════════════════════════ */
    (function() {
      const data = getLS('spielaufgaben');
      if (!data) return;
      const arr  = data.spielaufgaben || data;
      // Ersten spz-03 Eintrag mit AufgabenArt_1 = 'Erklärung'
      const item = arr.find(e => e.screenFile === location.pathname.split('/').pop() && e.AufgabenArt_1 === 'Erklärung');
      if (!item) return;

      if (item.AufgabenArt_1)
        document.getElementById('card-title').textContent = item.AufgabenArt_1;

      const parts = (item.Aufgabe_1 || '').split('\r');
      // Falls kein \r vorhanden: ganzen Text anzeigen
      const bodyText = parts.length > 1 ? parts.slice(1).join(' ').trim() : parts[0].trim();
      document.getElementById('card-text').textContent = bodyText;

      if (item.Picto1)
        document.getElementById('card-picto').src = `../assets/pictos/${item.Picto1.toLowerCase()}`;
    })();

    /* ══ Anfangsbilanz ══════════════════════════════════════════════════════ */
    (function() {
      const data   = getLS('bilanzStart');
      if (!data) return;
      const arr    = data.Anfangsbilanz || data;
      const teamNr = Number(localStorage.getItem('teamNumber')) || 1;

      // Team-Eintrag: teamNumber direkt als Array-Index, Fallback auf 0
      const entry  = arr[teamNr] ?? arr[teamNr - 1] ?? arr[0];
      if (!entry) return;
      const b = entry.Bilanz;
      if (!b) return;

      /* ── Summen on-the-fly berechnen ── */
      const n = k => Number(b[k]) || 0;
      const umlauf     = n('FluessigeMittel') + n('Forderungen') + n('Aktive_Rechnungsabgrenzung') + n('Vorraete');
      const anlage     = n('Infrastruktur_Anlage') + n('Gebaude_Anlage') + n('Immaterielle_Werte_Anlage');
      const totalAktiv = umlauf + anlage;
      const fremd      = n('Verbindlichkeiten') + n('Passive_Rechnungsabgrenzung') + n('Ruckstellungen') + n('Darlehen_Bank');
      const totalPassiv = fremd + n('Eigenkapital');

      /* ── Hilfs-Funktionen ── */
      function row(label, value, cls = '') {
        return `<div class="bl-row ${cls}">
          <span class="bl-label">${label}</span>
          <span class="bl-value">${value ?? '–'}</span>
        </div>`;
      }
      function total(label, value) {
        return `<div class="bl-total">
          <span class="bl-label">${label}</span>
          <span class="bl-value">${value ?? '–'}</span>
        </div>`;
      }
      function spacer() { return `<div class="bl-spacer"></div>`; }

      /* ── AKTIVA ── */
      document.getElementById('col-aktiva').innerHTML = `
        <div class="bilanz-col-header">AKTIVA</div>
        ${row('Flüssigen Mittel',              n('FluessigeMittel'))}
        ${row('Forderungen (Debitoren)',        n('Forderungen'))}
        ${row('Aktive Rechnungsabgrenzung',     n('Aktive_Rechnungsabgrenzung'))}
        ${row('Vorräte',                        n('Vorraete'))}
        ${row('Umlaufvermögen',                umlauf, 'subtotal')}
        ${spacer()}
        ${row('Infrastruktur Gerätepark, etc.', n('Infrastruktur_Anlage'))}
        ${row('Infrastruktur Gebäude',          n('Gebaude_Anlage'))}
        ${n('Immaterielle_Werte_Anlage') ? row('Immaterielle Werte', n('Immaterielle_Werte_Anlage')) : ''}
        ${row('Anlagevermögen',                anlage, 'subtotal')}
        ${total('TOTAL Aktiven', totalAktiv)}
      `;

      /* ── PASSIVA ── */
      document.getElementById('col-passiva').innerHTML = `
        <div class="bilanz-col-header">PASSIVA</div>
        ${row('Verbindlichkeiten (Kreditoren)', n('Verbindlichkeiten'))}
        ${row('Passive Rechnungsabgrenzung',    n('Passive_Rechnungsabgrenzung'))}
        ${row('Rückstellungen',                 n('Ruckstellungen'))}
        ${row('Darlehen Bank',                  n('Darlehen_Bank'))}
        ${row('Fremdkapital',                   fremd, 'subtotal')}
        ${spacer()}
        ${row('Eigenkapital',                   n('Eigenkapital'), 'subtotal')}
        ${total('TOTAL Passiven', totalPassiv)}
      `;
    })();
  </script>
</body>
</html>
