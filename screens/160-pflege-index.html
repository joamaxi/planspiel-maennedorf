<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pflegeintensität – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      padding: 60px 32px 24px 80px;
      display: flex;
      gap: 120px;
      align-items: flex-start;
    }

    /* ══ LINKE SPALTE ══════════════════════════════════════════════════════ */
    .col-left {
      width: 280px;
      flex-shrink: 0;
    }

    .decision-card {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 20px 28px 20px;
      background: #fff;
      margin-top: 80px;
    }

    .card-illustration {
      position: absolute;
      top: -28px;
      right: 12px;
      height: 52px;
      width: auto;
      display: block;
      background: #fff;
    }

    .card-title {
      font-weight: 800;
      color: var(--color-accent);
      margin: 0 0 12px 0;
      line-height: 1.1;
    }

    .card-text {
      font-size: 0.86rem;
      color: #333;
      line-height: 1.6;
      margin: 0;
    }

    /* ══ RECHTE SPALTE ═════════════════════════════════════════════════════ */
    .col-right {
      flex: 1;
      min-width: 0;
      max-width: 480px;
      padding-top: 20px;
    }

    /* L-Rahmen Container */
    .npr-wrapper {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 24px 0 24px 24px;
      margin-top: 60px;
    }

    .npr-title {
      position: absolute;
      top: -60px;
      left: 0;
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
      white-space: nowrap;
      padding: 0 0 0 20px;
    }

    .npr-subtitle {
      position: absolute;
      top: -25px;
      left: 0;
      font-size: 0.75rem;
      color: var(--color-label-light);
      padding: 0 0 0 22px;
      white-space: nowrap;
    }

    /* Inneres Layout: Labels links, Gesamtes-Spital-Spalte rechts */
    .npr-inner {
      display: flex;
      align-items: stretch;
      gap: 0;
    }

    .npr-labels {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .npr-labels-header {
      padding: 10px 8px;
      border-bottom: 1px solid transparent;
      font-size: 0.82rem;
      font-weight: 700;
      color: transparent;
      /* gleiche Höhe wie .npr-col-header */
    }

    .npr-row {
      display: flex;
      align-items: center;
      flex: 1;
      padding-right: 20px;
    }

    .npr-row-label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--color-accent);
      line-height: 1.3;
    }

    .npr-row-sub {
      display: block;
      font-size: 0.78rem;
      color: var(--color-label);
      font-weight: 400;
    }

    /* Gesamte Klinik Spalte */
    .npr-col {
      width: 150px;
      flex-shrink: 0;
      background: #f0f5f9;
      border-radius: 10px 0 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .npr-col-header {
      width: 100%;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--color-accent);
      padding: 10px 8px;
      border-bottom: 1px solid #d8e8f0;
    }

    .npr-col-values {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 8px 16px;
      gap: 8px;
      width: 100%;
    }

    .npr-badge {
      width: 100%;
      height: 40px;
      background: var(--color-accent);
      color: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 800;
    }

    /* Verhältnis-Zeile: "1:" + Badge */
    .npr-ratio-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .npr-ratio-prefix {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-accent);
      white-space: nowrap;
    }

    .npr-badge.outline {
      background: #fff;
      color: var(--color-accent);
      border: 0px solid var(--color-accent);
    }

    .npr-badge.muted {
      background: var(--color-label);
    }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="150-aufgabe.html"
  data-next="170-aufgabe.html"
  data-spielzug-label="Spielzug 17"
  data-step-current="17"
  data-step-total="20"
  data-wirkung="00_wirkungen.png"
  data-disable-handbuch="true"
  data-disable-bank="true"
  
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- ══ LINKE SPALTE ══ -->
      <div class="col-left">
        <div class="decision-card">
          <img id="card-picto-1" src="../assets/pictos/picto_aufgabe.png"
               class="card-illustration" alt="" />
          <h1 class="card-title" id="art-1">Aufgabe</h1>
          <p class="card-text" id="text-1"></p>
        </div>
      </div>

      <!-- ══ RECHTE SPALTE ══ -->
      <div class="col-right">

        <div class="npr-wrapper">
          <span class="npr-title">Pflegeintensität</span>
          <span class="npr-subtitle">Pflegeintensität resp. das Verhältnis Patient zu Personal</span>
          <div class="npr-inner">

            <!-- Labels -->
            <div class="npr-labels">
              <div class="npr-labels-header">&nbsp;</div>
              <div class="npr-row">
                <span class="npr-row-label">Anzahl Personaleinheiten</span>
              </div>
              <div class="npr-row">
                <span class="npr-row-label">Anzahl Patienteneinheiten</span>
              </div>
              <div class="npr-row">
                <span class="npr-row-label">
                  Verhältnis Personal zu Patient
                  <span class="npr-row-sub">(Nurse to Patient Ratio)</span>
                </span>
              </div>
              <div class="npr-row">
                <span class="npr-row-label">Zusätzlicher Indexpunkt <strong>MIZI</strong></span>
              </div>
              <div class="npr-row">
                <span class="npr-row-label">Zusätzlicher Indexpunkt <strong>PAZI</strong></span>
              </div>
            </div>

            <!-- Gesamte Klinik Spalte -->
            <div class="npr-col">
              <div class="npr-col-header">Gesamte Klinik</div>
              <div class="npr-col-values">
                <div class="npr-badge muted" id="val-personal">–</div>
                <div class="npr-badge muted" id="val-patienten">–</div>
                <div class="npr-badge outline" id="val-ratio">?</div>
                <div class="npr-badge" id="val-mizi">–</div>
                <div class="npr-badge" id="val-pazi">–</div>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; }
    }
    function setLS(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }
    function boldQuotes(text) {
      return text.replace(/"([^"]+)"/g, '<strong>"$1"</strong>');
    }

    /* ══ Spielaufgaben → linke Karte ══════════════════════════════════════ */
    (function() {
      const data = getLS('spielaufgaben');
      if (!data) return;
      const arr  = data.spielaufgaben || data;
      const item = arr.find(e => e.screenFile === location.pathname.split('/').pop());
      if (!item) return;
      if (item.AufgabenArt_1) document.getElementById('art-1').textContent = item.AufgabenArt_1;
      const parts = (item.Aufgabe_1 || '').split('\r');
      const body  = parts.length > 1 ? parts.slice(1).join(' ').trim() : parts[0].trim();
      document.getElementById('text-1').innerHTML = boldQuotes(body);
      if (item.Picto1)
        document.getElementById('card-picto-1').src = `../assets/pictos/${item.Picto1.toLowerCase()}`;
    })();

    /* ══ Pflegeintensität berechnen ════════════════════════════════════════ */
    (function() {

      /* ── 1. Total Personaleinheiten (intern + extern) ── */
      const planungIntern = getLS('personalplanung') || {};
      const planungExtern = getLS('personalplanungExtern') || {};
      const personalIntern = Object.values(planungIntern).reduce((s, v) => s + (Number(v) || 0), 0);
      const personalExtern = Object.values(planungExtern).reduce((s, v) => s + (Number(v) || 0), 0);
      const personal = personalIntern + personalExtern;

      /* ── 2. Total Patienteneinheiten (aus patientenAufnahme, spz-14) ── */
      const aufnahme  = getLS('patientenAufnahme') || {};
      let   patienten = 0;
      Object.entries(aufnahme).forEach(([key, val]) => {
        if (typeof val === 'object' && val !== null) {
          patienten += (Number(val.PHP) || 0) + (Number(val.Allgemein) || 0) + (Number(val.Ambulant) || 0);
        } else {
          patienten += Number(val) || 0;
        }
      });

      /* ── 3. Verhältnis Patienten pro Personal (auf 0.5 gerundet) ── */
      const ratio = personal > 0
        ? Math.round((patienten / personal) * 2) / 2
        : 0;

      /* Anzeige: ohne unnötige Dezimalstellen (4 statt 4.00) */
      const ratioDisplay = ratio % 1 === 0 ? ratio : ratio.toFixed(1);

      /* ── 4. Lookup ratioWerte ── */
      const ratioData = getLS('ratioWerte');
      const werte     = ratioData ? (ratioData.ratioWerte || ratioData) : [];

      /* Fallback: hardcodierte Tabelle falls JSON nicht geladen */
      const FALLBACK = [
        {scala:1,   mizi:5,   pazi:12},
        {scala:1.5, mizi:7,   pazi:12},
        {scala:2,   mizi:9,   pazi:12},
        {scala:2.5, mizi:9,   pazi:8 },
        {scala:3,   mizi:10,  pazi:10},
        {scala:3.5, mizi:9,   pazi:7 },
        {scala:4,   mizi:9,   pazi:5 },
        {scala:4.5, mizi:5,   pazi:3 },
        {scala:5,   mizi:0,   pazi:0 },
        {scala:5.5, mizi:2,   pazi:-3},
        {scala:6,   mizi:-5,  pazi:-5},
        {scala:6.5, mizi:-7,  pazi:-7},
        {scala:7,   mizi:-10, pazi:-10},
      ];

      let mizi = '–', pazi = '–';

      if (werte.length > 0) {
        /* Aus JSON laden */
        const miziEntry = werte.find(e =>
          Number(e.indexScala) === ratio &&
          e.zufriedenheitsName === 'Mitarbeiter-Zufriedenheit');
        const paziEntry = werte.find(e =>
          Number(e.indexScala) === ratio &&
          e.zufriedenheitsName === 'Patienten-Zufriedenheit');
        if (miziEntry !== undefined) mizi = miziEntry.indexWert;
        if (paziEntry !== undefined) pazi = paziEntry.indexWert;
      } else {
        /* Fallback Tabelle */
        const row = FALLBACK.find(r => r.scala === ratio);
        if (row) { mizi = row.mizi; pazi = row.pazi; }
      }

      /* ── 5. Anzeige ── */
      document.getElementById('val-personal').textContent  = personal  || '–';
      document.getElementById('val-patienten').textContent = patienten || '–';
      document.getElementById('val-ratio').textContent     = ratio > 0 ? `1:${ratioDisplay}` : '?';
      document.getElementById('val-mizi').textContent      = mizi;
      document.getElementById('val-pazi').textContent      = pazi;

      /* ── 6. Ergebnis speichern (für check.html / weitere Seiten) ── */
      if (personal > 0 || patienten > 0) {
        setLS('nprResult', { personal, patienten, ratio, mizi, pazi });

        /* Index-Punkte in zufriedenheiten eintragen */
        const zuf = getLS('zufriedenheiten') || {};
        if (mizi !== '–') zuf.MIZI_NPR = Number(mizi);
        if (pazi !== '–') zuf.PAZI_NPR = Number(pazi);
        setLS('zufriedenheiten', zuf);
      }
    })();
  </script>
</body>
</html>
