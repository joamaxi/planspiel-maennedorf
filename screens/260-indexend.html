<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zufriedenheits-Indices – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 100px 100px 24px 100px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 60px;
      align-items: start;
    }

    /* ══ Spielaufgabe (linke Spalte) ═════════════════════════════════════ */
    .task-col {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding-top: 20px;
    }

    .task-card {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 18px 22px;
      background: #fff;
      margin-top: 28px;
    }

    .task-card-icon {
      position: absolute;
      top: -26px; right: 10px;
      height: 48px; width: auto;
    }

    .task-card-title {
      font-weight: 800;
      color: var(--color-accent);
      margin: 0 0 9px;
      font-size: 0.95rem;
    }

    .task-card-text {
      font-size: 0.82rem;
      color: #333;
      line-height: 1.6;
      margin: 0;
    }

    /* ══ Zufriedenheits-Tabelle (rechte Spalte) ═══════════════════════════ */
    .zuf-col { min-width: 0; }

    .zuf-title {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
      margin: 0 0 18px;
      line-height: 1.15;
    }

    .zuf-table-wrap {
      border: 1px solid var(--color-border);
      border-radius: 10px;
      overflow: hidden;
    }

    .zuf-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .zuf-table thead th {
      background: #f4f8fc;
      color: var(--color-label);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 10px 18px;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
    }
    .zuf-table thead th:first-child { text-align: left; }

    .zuf-table tbody tr {
      border-bottom: 1px solid #eef2f6;
    }
    .zuf-table tbody tr:last-child { border-bottom: none; }

    .zuf-table tbody td {
      padding: 13px 18px;
      color: #111;
      font-size: 0.88rem;
      text-align: center;
      vertical-align: middle;
    }
    .zuf-table tbody td:first-child {
      text-align: left;
      color: var(--color-accent);
      font-weight: 600;
    }

    .val-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 10px;
      min-width: 52px;
      height: 36px;
      padding: 0 12px;
    }

    .val-periode {
      font-weight: 600;
      color: #3a7a3a;
    }
    .val-periode.neg { color: #a03030; }
    .val-periode.zero { color: #888; }

    /* Total-Zeile */
    .zuf-table tfoot tr { background: #7fa8c0; }
    .zuf-table tfoot td {
      padding: 11px 18px;
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      text-align: center;
      border-top: 1px solid #6a94aa;
    }
    .zuf-table tfoot td:first-child { text-align: left; }

    .val-box-total {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: var(--color-accent);
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 10px;
      min-width: 52px;
      height: 36px;
      padding: 0 12px;
    }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="250-projektliste.html"
  data-next="270-betriebskosten.html"
  data-spielzug-label="Spielzug 27"
  data-step-current="27"
  data-step-total="20"
  data-wirkung="00-wirkungen.png"
  data-disable-handbuch="true"
  data-disable-ereignis="true"
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- Linke Spalte: Spielaufgabe -->
      <aside class="task-col">
        <div class="task-card">
          <img id="picto-1" src="../assets/pictos/picto_meeting.png" class="task-card-icon" alt="" />
          <h2 class="task-card-title" id="art-1">Erklärung</h2>
          <p class="task-card-text" id="text-1"></p>
        </div>
      </aside>

      <!-- Rechte Spalte: Zufriedenheiten -->
      <section class="zuf-col">
        <h1 class="zuf-title">Zufriedenheits Indices am Ende Periode</h1>
        <div class="zuf-table-wrap">
          <table class="zuf-table" id="zuf-table">
            <thead>
              <tr>
                <th>Zufriedenheit</th>
                <th>Anfang</th>
                <th>Periode</th>
                <th>Ende</th>
              </tr>
            </thead>
            <tbody id="zuf-body"></tbody>
                  </table>
        </div>
      </section>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function boldQuotes(t) { return (t||'').replace(/"([^"]+)"/g, '<strong>"$1"</strong>'); }

    /* ══ Spielaufgaben ═══════════════════════════════════════════════════ */
    (function() {
      const data = getLS('spielaufgaben');
      if (!data) return;
      const arr  = data.spielaufgaben || data;
      const item = arr.find(e => e.screenFile === location.pathname.split('/').pop());
      if (!item) return;
      function parseBody(t) {
        const p = (t||'').split('\r');
        return p.length > 1 ? p.slice(1).join(' ').trim() : p[0].trim();
      }
      if (item.AufgabenArt_1) document.getElementById('art-1').textContent = item.AufgabenArt_1;
      document.getElementById('text-1').innerHTML = boldQuotes(parseBody(item.Aufgabe_1));
      if (item.Picto1) document.getElementById('picto-1').src = `../assets/pictos/${item.Picto1.toLowerCase()}`;
    })();

    /* ══ Zufriedenheits-Tabelle ══════════════════════════════════════════ */
    (function() {
      const ORDER = ['MIZI', 'PAZI', 'BEZI', 'ZUZI', 'EIZI'];

      /* Anfangswerte aus zufriedenheiten-Import */
      const zufData  = getLS('zufriedenheiten');
      const cachedNames = getLS('zufNamen') || {};
      const zufRaw   = zufData ? (zufData.Zufriedenheiten || zufData.zufriedenheiten || zufData) : [];
      const zufArr   = Array.isArray(zufRaw) ? zufRaw
        : Object.entries(zufRaw)
            .filter(([k]) => !k.endsWith('_NPR'))
            .map(([k, val]) => ({
              Zufriedenheit_Kuerzel: k,
              Zufriedenheit_Name: cachedNames[k] || k,
              Zufriedenheit_Wert: Number(val) || 0
            }));
      const anfangMap = {};
      const nameMap   = {};
      zufArr.forEach(z => {
        const k = z.Zufriedenheit_Kuerzel;
        anfangMap[k] = Number(z.Zufriedenheit_Wert) || 0;
        nameMap[k]   = z.Zufriedenheit_Name || k;
      });
      /* Namen für künftige Fallbacks cachen (nur wenn Array-Format mit echten Namen) */
      if (Array.isArray(zufRaw) && zufArr.some(z => z.Zufriedenheit_Name !== z.Zufriedenheit_Kuerzel)) {
        localStorage.setItem('zufNamen', JSON.stringify(nameMap));
      }

      /* NPR-Punkte aus spz-17 */
      const zufExtra = getLS('zufriedenheiten') || {};
      const npr = {
        MIZI: Number(zufExtra.MIZI_NPR) || 0,
        PAZI: Number(zufExtra.PAZI_NPR) || 0
      };

      /* Projekt-Wirkungen summieren */
      const projektWirk = { MIZI:0, PAZI:0, BEZI:0, ZUZI:0, EIZI:0 };
      const entscheide  = getLS('projektEntscheide') || {};
      const rawProjekte = getLS('projekte');
      const alleRecs    = rawProjekte ? (rawProjekte.projekte || rawProjekte) : [];

      const projektMap = {};
      alleRecs.forEach(r => {
        const nr = r.projektNr;
        if (!projektMap[nr]) projektMap[nr] = [];
        projektMap[nr].push(r);
      });

      Object.entries(entscheide).forEach(([nr, ent]) => {
        if (ent.levelKosten === undefined || ent.levelKosten === null) return;
        const records = projektMap[Number(nr)] || [];
        const rec = records.find(r =>
          r.levelKosten === ent.levelKosten && r.levelBezeichnung === ent.levelBezeichnung
        ) || records.find(r => r.levelKosten === ent.levelKosten);
        if (!rec) return;
        (rec.wirkungen || []).forEach(w => {
          const val = Number(w.wert) || 0;
          if (w.name && projektWirk[w.name] !== undefined) projektWirk[w.name] += val;
        });
      });

      /* Periode = Projektwirkung + NPR (nur MIZI/PAZI) */
      const periodeMap = {};
      ORDER.forEach(k => {
        periodeMap[k] = projektWirk[k] + (npr[k] || 0);
      });

      /* Zeilen rendern */
      const rows = ORDER.map(k => {
        const anfang  = anfangMap[k] ?? 0;
        const periode = periodeMap[k];
        const ende    = anfang + periode;
        const perClass = periode > 0 ? '' : (periode < 0 ? ' neg' : ' zero');
        const perSign  = periode > 0 ? '+' : '';
        return `<tr>
          <td>${nameMap[k] || k} <span style="font-weight:400;">(${k})</span></td>
          <td><span class="val-box">${anfang}</span></td>
          <td><span class="val-periode${perClass}">${perSign}${periode}</span></td>
          <td><span class="val-box">${ende}</span></td>
        </tr>`;
      }).join('');

      document.getElementById('zuf-body').innerHTML = rows;

      /* Ende-Werte global merken für den Export */
      window._zufEndeMap = {};
      ORDER.forEach(k => {
        window._zufEndeMap[k] = (anfangMap[k] ?? 0) + periodeMap[k];
      });
    })();

    /* ══ Export beim Weiter-Klick ════════════════════════════════════════ */
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#nav-next')) return;

      const zufData = getLS('zufriedenheiten');
      if (!zufData) return;

      const endeMap  = window._zufEndeMap || {};
      const cachedN  = getLS('zufNamen') || {};
      const zufRaw   = zufData.Zufriedenheiten || zufData.zufriedenheiten || zufData;
      const zufArr   = Array.isArray(zufRaw) ? zufRaw
        : Object.entries(zufRaw)
            .filter(([k]) => !k.endsWith('_NPR'))
            .map(([k, val]) => ({
              Zufriedenheit_Kuerzel: k,
              Zufriedenheit_Name: cachedN[k] || k,
              Zufriedenheit_Wert: Number(val) || 0
            }));

      /* Ende-Wert als neuer Anfangswert für nächste Runde — Array-Format beibehalten */
      const exportArr = zufArr.map(z => ({
        ...z,
        Zufriedenheit_Wert: endeMap[z.Zufriedenheit_Kuerzel] ?? z.Zufriedenheit_Wert
      }));

      /* Projekt 105 (Marktpositionierung): optionWert2 = Zugang zum Arbeitsmarkt */
      const _entscheide  = getLS('projektEntscheide') || {};
      const _rawProjekte = getLS('projekte');
      const _alleRecs    = _rawProjekte ? (_rawProjekte.projekte || _rawProjekte) : [];
      const _proj105     = _alleRecs.filter(r => r.projektNr === 105);
      let zugangArbeitsmarkt = 0;
      const _ent105 = _entscheide[105];
      if (_ent105 && _ent105.levelKosten !== undefined && _ent105.levelKosten !== null) {
        const _rec = _proj105.find(r => r.levelKosten === _ent105.levelKosten && r.levelBezeichnung === _ent105.levelBezeichnung)
                  || _proj105.find(r => r.levelKosten === _ent105.levelKosten);
        const _opt = _rec && (_rec.optionen || []).find(o => o.name === 'Zugang zum Arbeitsmarkt');
        if (_opt) zugangArbeitsmarkt = Number(_opt.wert) || 0;
      }

      /* Dateiname: team{nr}-runde{runde+1}-zufriedenheiten.json */
      const team      = localStorage.getItem('teamNumber') || '0';
      const teamName  = localStorage.getItem('klinikName') || '';
      const runde     = localStorage.getItem('rundeNumber') || '1';
      const filename  = `team${team}-runde${Number(runde) + 1}-zufriedenheiten.json`;

      const exportData = {
        Zufriedenheiten: exportArr,
        Zugang_Arbeitsmarkt: zugangArbeitsmarkt
      };

      /* Direkt in data/json speichern (keepalive: überlebt die Seitennavigation) */
      fetch('../data/json/save.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename, data: JSON.stringify(exportData, null, 2) }),
        keepalive: true
      }).catch(err => console.error('Zufriedenheiten-Export fehlgeschlagen:', err));
    }, true);
  </script>
</body>
</html>
