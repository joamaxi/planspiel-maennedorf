<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abschreibungen – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 100px 24px 100px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 120px;
      align-items: start;
    }

    /* ══ Spielaufgabe (linke Spalte) ═════════════════════════════════════ */
    .task-col {
      display: flex;
      flex-direction: column;
      margin-top: 34px;
      gap: 32px;
    }

    .task-card {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 18px 22px;
      background: #fff;
      margin-top: 28px;
    }

    .task-card-icon {
      position: absolute;
      top: -26px; right: 10px;
      height: 48px; width: auto;
    }

    .task-card-title {
      font-weight: 800;
      color: var(--color-accent);
      margin: 0 0 9px;
      font-size: 0.95rem;
    }

    .task-card-text {
      font-size: 0.82rem;
      color: #333;
      line-height: 1.6;
      margin: 0;
    }

    /* ══ Abschreibungen (rechte Spalte) ═══════════════════════════════════ */
    .abschr-col { min-width: 0; padding-top: 8px; }

    .section-label {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
      margin: 0 0 14px;
    }

    .abschr-header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .abschr-mio-hint {
      font-size: 0.75rem;
      color: var(--color-label-light);
      padding-right: 8px;
    }

    .abschr-list {
      border-top: 1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-radius: 8px 0 0 0;
    }

    .abschr-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 18px 16px;
      border-bottom: 1px solid var(--color-border-light);
      gap: 16px;
    }
    .abschr-row:last-child { border-bottom: none; }

    .abschr-label {
      color: var(--color-accent);
      font-size: 0.92rem;
      font-weight: 500;
    }

    .abschr-detail {
      font-size: 0.75rem;
      color: var(--color-label-light);
      margin-top: 3px;
    }

    .val-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 10px;
      min-width: 68px;
      height: 40px;
      padding: 0 18px;
      flex-shrink: 0;
    }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="270-betriebskosten.html"
  data-next="290-bankzinsen.html"
  data-spielzug-label="Spielzug 29"
  data-step-current="29"
  data-step-total="20"
  data-wirkung="00_wirkungen.png"
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- Linke Spalte: Spielaufgaben -->
      <aside class="task-col">
        <div class="task-card">
          <img id="picto-1" src="../assets/pictos/picto_aufgabe.png" class="task-card-icon" alt="" />
          <h2 class="task-card-title" id="art-1">Spielbrett-Aufgabe</h2>
          <p class="task-card-text" id="text-1"></p>
        </div>
        <div class="task-card" id="card-2" style="display:none;">
          <img id="picto-2" src="../assets/pictos/picto_aufgabe.png" class="task-card-icon" alt="" />
          <h2 class="task-card-title" id="art-2">Spielbrett-Aufgabe</h2>
          <p class="task-card-text" id="text-2"></p>
        </div>
      </aside>

      <!-- Rechte Spalte: Abschreibungen -->
      <section class="abschr-col">
        <div class="abschr-header-row">
          <p class="section-label">Abschreibungen</p>
          <span class="abschr-mio-hint">in Mio</span>
        </div>
        <div class="abschr-list">
          <div class="abschr-row">
            <div>
              <div class="abschr-label">Abschreibungen der Infrastruktur</div>
              <!--<div class="abschr-detail" id="detail-infra"></div>*/-->
            </div>
            <span class="val-box" id="val-infra">–</span>
          </div>
          <div class="abschr-row">
            <div>
              <div class="abschr-label">Abschreibungen der Gebäude</div>
              <!--<div class="abschr-detail" id="detail-geb"></div>-->
            </div>
            <span class="val-box" id="val-geb">–</span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function setLS(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
    function boldQuotes(t) { return (t||'').replace(/"([^"]+)"/g, '<strong>"$1"</strong>'); }

    /* ══ Spielaufgaben ═══════════════════════════════════════════════════ */
    (function() {
      const data = getLS('spielaufgaben');
      if (!data) return;
      const arr  = data.spielaufgaben || data;
      const item = arr.find(e => e.screenFile === location.pathname.split('/').pop());
      if (!item) return;
      function parseBody(t) {
        const p = (t||'').split('\r');
        return p.length > 1 ? p.slice(1).join(' ').trim() : p[0].trim();
      }
      if (item.AufgabenArt_1) document.getElementById('art-1').textContent = item.AufgabenArt_1;
      document.getElementById('text-1').innerHTML = boldQuotes(parseBody(item.Aufgabe_1));
      if (item.Picto1) document.getElementById('picto-1').src = `../assets/pictos/${item.Picto1.toLowerCase()}`;
      if (item.Aufgabe_2) {
        document.getElementById('card-2').style.display = '';
        if (item.AufgabenArt_2) document.getElementById('art-2').textContent = item.AufgabenArt_2;
        document.getElementById('text-2').innerHTML = boldQuotes(parseBody(item.Aufgabe_2));
        if (item.Picto2) document.getElementById('picto-2').src = `../assets/pictos/${item.Picto2.toLowerCase()}`;
      }
    })();

    /* ══ Abschreibungen berechnen ════════════════════════════════════════ */
    const bilanzData   = getLS('bilanzStart');
    const bilanzArr    = bilanzData ? (bilanzData.Anfangsbilanz || bilanzData) : null;
    const teamNr       = Number(localStorage.getItem('teamNumber')) || 1;
    const bilanzIdx    = bilanzArr
      ? (bilanzArr[teamNr] !== undefined ? teamNr : (bilanzArr[teamNr-1] !== undefined ? teamNr-1 : 0))
      : 0;
    const bilanzEntry  = bilanzArr ? bilanzArr[bilanzIdx] : null;
    const bilanz       = bilanzEntry?.Bilanz || {};

    /* Sätze aus bilanzStart */
    let rateInfra = Number(bilanzEntry?.AbschreibungMaschinen) || 0;
    const rateGeb = Number(bilanzEntry?.AbschreibungGebaude) || 0;
    const reduktionsSatz = Number(bilanzEntry?.Abschreibungsreduktion) || 0;

    /* Projekt-Investitionen aus projektEntscheide + projekte */
    const entscheide   = getLS('projektEntscheide') || {};
    const rawPrj       = getLS('projekte');
    const alleRecs      = rawPrj ? (rawPrj.projekte || rawPrj) : [];
    const currentRunde = Number(localStorage.getItem('rundeNumber')) || 1;

    const projektMap = {};
    alleRecs.forEach(r => {
      if (!projektMap[r.projektNr]) projektMap[r.projektNr] = [];
      projektMap[r.projektNr].push(r);
    });

    let investInfra = 0, investGeb = 0;

    Object.entries(entscheide).forEach(([nr, ent]) => {
      if (!ent.levelKosten) return;
      /* Mehrperioden-Projekte aus einer Vorrunde sind bereits in der
         Bilanz-Basis (Infrastruktur_Anlage/Gebaude_Anlage) enthalten —
         nicht nochmals als Investition dieser Runde zählen. */
      if (ent.projektPeriode > 1 && ent.gewaehltInRunde !== currentRunde) return;
      const records = projektMap[Number(nr)] || [];
      const rec = records.find(r =>
        r.levelKosten === ent.levelKosten && r.levelBezeichnung === ent.levelBezeichnung
      ) || records.find(r => r.levelKosten === ent.levelKosten);
      if (!rec) return;
      (rec.optionen || []).forEach(o => {
        if (o.name === 'Abschreibung Maschinen')       investInfra += ent.levelKosten;
        if (o.name === 'Abschreibung Gebäude')         investGeb   += ent.levelKosten;
        if (o.name === 'Abschreibreduktion Maschinen') rateInfra    = reduktionsSatz;
      });
    });

    /* Basis + Investitionen × Satz, auf ganze Zahl runden */
    const baseInfra  = Number(bilanz.Infrastruktur_Anlage) || 0;
    const baseGeb    = Number(bilanz.Gebaude_Anlage) || 0;
    const abschrInfra = Math.round((baseInfra + investInfra) * rateInfra / 100);
    const abschrGeb   = Math.round((baseGeb   + investGeb)   * rateGeb   / 100);

    /* Anzeige */
    document.getElementById('val-infra').textContent = abschrInfra;
    document.getElementById('val-geb').textContent   = abschrGeb;

    /* ══ Transfer beim Weiter-Klick ══════════════════════════════════════ */
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#nav-next')) return;
      if (localStorage.getItem('done_spz29') === 'true') return;

      const er        = getLS('erfolgsrechnung') || {};
      const protokoll = getLS('protokoll') || [];
      const teamLabel = localStorage.getItem('klinikName') || `Team ${teamNr}`;

      /* Bilanz frisch lesen und Felder setzen */
      const bd = getLS('bilanzStart');
      if (bd) {
        const ba  = bd.Anfangsbilanz || bd;
        const idx = ba[teamNr] !== undefined ? teamNr : (ba[teamNr-1] !== undefined ? teamNr-1 : 0);
        const be  = ba[idx];
        if (be?.Bilanz) {
          be.Bilanz.Investitionen_Infrastruktur  = investInfra;
          be.Bilanz.Investitionen_Gebaeude       = investGeb;
          be.Bilanz.Abschreibungen_Infrastruktur = abschrInfra;
          be.Bilanz.Abschreibungen_Gebaeude      = abschrGeb;
          ba[idx] = be;
          setLS('bilanzStart', bd.Anfangsbilanz ? { ...bd, Anfangsbilanz: ba } : ba);
        }
      }

      /* Erfolgsrechnung: Abschreibungen setzen (nicht akkumulieren) */
      const totalAbschr = abschrInfra + abschrGeb;
      er.Abschreibungen = totalAbschr;
      setLS('erfolgsrechnung', er);

      /* Protokoll */
      if (abschrInfra > 0) protokoll.push({
        zeit: new Date().toISOString(), spielzug: 'spz-29',
        aktion: 'Abschreibungen Infrastruktur',
        von: 'Anlagevermögen Infrastruktur', nach: 'Abschreibungen',
        betrag: abschrInfra, team: teamLabel
      });
      if (abschrGeb > 0) protokoll.push({
        zeit: new Date().toISOString(), spielzug: 'spz-29',
        aktion: 'Abschreibungen Gebäude',
        von: 'Anlagevermögen Gebäude', nach: 'Abschreibungen',
        betrag: abschrGeb, team: teamLabel
      });
      setLS('protokoll', protokoll);
      localStorage.setItem('done_spz29', 'true');
    }, true);
  </script>
</body>
</html>
