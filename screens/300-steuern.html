<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steuern – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 100px 100px 24px 100px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 48px;
      align-items: start;
    }

    /* ══ Spielaufgabe (linke Spalte) ═════════════════════════════════════ */
    .task-col { margin-top: 28px; }

    .task-card {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 18px 22px;
      background: #fff;
      margin-top: 28px;
    }

    .task-card-icon {
      position: absolute;
      top: -26px; right: 10px;
      height: 48px; width: auto;
    }

    .task-card-title {
      font-weight: 800;
      color: var(--color-accent);
      margin: 0 0 9px;
      font-size: 0.95rem;
    }

    .task-card-text {
      font-size: 0.82rem;
      color: #333;
      line-height: 1.6;
      margin: 0;
    }

    /* ══ Steuern (rechte Spalte) ══════════════════════════════════════════ */
    .steuer-col { padding-top: 8px; }

    .section-label {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
      margin: 0 0 14px;
    }

    .steuer-header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .steuer-mio-hint {
      font-size: 0.75rem;
      color: var(--color-label-light);
      padding-right: 8px;
    }

    .steuer-list {
      border-top: 1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-radius: 8px 0 0 0;
    }

    .steuer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 18px 16px;
      gap: 16px;
    }

    .steuer-label {
      color: var(--color-accent);
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.35;
    }

    .val-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 10px;
      min-width: 80px;
      height: 40px;
      padding: 0 18px;
      flex-shrink: 0;
    }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="290-bankzinsen.html"
  data-next="310-abschluss.html"
  data-spielzug-label="Spielzug 31"
  data-step-current="31"
  data-step-total="20"
  data-wirkung="00_wirkungen.png"
  data-disable-bank="true"
  data-disable-ereignis="true"
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- Linke Spalte: Spielaufgabe -->
      <aside class="task-col">
        <div class="task-card">
          <img id="picto-1" src="../assets/pictos/picto_aufgabe.png" class="task-card-icon" alt="" />
          <h2 class="task-card-title" id="art-1">Spielbrett-Aufgabe</h2>
          <p class="task-card-text" id="text-1"></p>
        </div>
      </aside>

      <!-- Rechte Spalte: Steuern -->
      <section class="steuer-col">
        <div class="steuer-header-row">
          <p class="section-label">Steuern</p>
          <span class="steuer-mio-hint">in Mio</span>
        </div>
        <div class="steuer-list">
          <div class="steuer-row">
            <span class="steuer-label">Steuern auf übrige<br>betriebliche Erträge</span>
            <span class="val-box" id="val-steuern">–</span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function setLS(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
    function boldQuotes(t) { return (t||'').replace(/"([^"]+)"/g, '<strong>"$1"</strong>'); }

    /* ══ Spielaufgaben ═══════════════════════════════════════════════════ */
    (function() {
      const data = getLS('spielaufgaben');
      if (!data) return;
      const arr  = data.spielaufgaben || data;
      const item = arr.find(e => e.screenFile === location.pathname.split('/').pop());
      if (!item) return;
      function parseBody(t) {
        const p = (t||'').split('\r');
        return p.length > 1 ? p.slice(1).join(' ').trim() : p[0].trim();
      }
      if (item.AufgabenArt_1) document.getElementById('art-1').textContent = item.AufgabenArt_1;
      document.getElementById('text-1').innerHTML = boldQuotes(parseBody(item.Aufgabe_1));
      if (item.Picto1) document.getElementById('picto-1').src = `../assets/pictos/${item.Picto1.toLowerCase()}`;
    })();

    /* ══ Steuern berechnen ════════════════════════════════════════════════ */
    const bilanzData  = getLS('bilanzStart');
    const bilanzArr   = bilanzData ? (bilanzData.Anfangsbilanz || bilanzData) : null;
    const teamNr      = Number(localStorage.getItem('teamNumber')) || 1;
    const bilanzIdx   = bilanzArr
      ? (bilanzArr[teamNr] !== undefined ? teamNr : (bilanzArr[teamNr-1] !== undefined ? teamNr-1 : 0))
      : 0;
    const bilanzEntry = bilanzArr ? bilanzArr[bilanzIdx] : null;

    const steuersatz  = Number(bilanzEntry?.Steuern) || 0;
    const er0         = getLS('erfolgsrechnung') || {};
    const steuerbasis = (Number(er0.Andere_Ertraege) || 0) + (Number(er0.Ausserordentliche_Ertraege) || 0);
    const steuern     = Math.round(steuerbasis * steuersatz / 100);

    document.getElementById('val-steuern').textContent = steuern;

    /* ══ Transfer beim Weiter-Klick ══════════════════════════════════════ */
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#nav-next')) return;
      if (localStorage.getItem('done_spz31') === 'true') return;

      const er        = getLS('erfolgsrechnung') || {};
      const protokoll = getLS('protokoll')       || [];
      const teamLabel = localStorage.getItem('klinikName') || `Team ${teamNr}`;

      const bd = getLS('bilanzStart');
      if (bd) {
        const ba  = bd.Anfangsbilanz || bd;
        const idx = ba[teamNr] !== undefined ? teamNr : (ba[teamNr-1] !== undefined ? teamNr-1 : 0);
        const be  = ba[idx];
        if (be?.Bilanz) {
          be.Bilanz.FluessigeMittel = (Number(be.Bilanz.FluessigeMittel) || 0) - steuern;
          ba[idx] = be;
          setLS('bilanzStart', bd.Anfangsbilanz ? { ...bd, Anfangsbilanz: ba } : ba);
        }
      }

      er.Steuern = steuern;
      setLS('erfolgsrechnung', er);

      protokoll.push({
        zeit: new Date().toISOString(), spielzug: 'spz-31',
        aktion: 'Steuern auf übrige betriebliche Erträge',
        von: 'Flüssige Mittel', nach: 'Zinsen und Steuern',
        betrag: steuern, team: teamLabel
      });
      setLS('protokoll', protokoll);
      localStorage.setItem('done_spz31', 'true');
    }, true);
  </script>
</body>
</html>
