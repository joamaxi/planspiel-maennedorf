<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erfolgsrechnung – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 100px 24px;
    }

    /* ══ Erfolgsrechnung (volle Breite) ══════════════════════════════════ */
    .er-col-wrap { padding-top: 0; }

    .section-label {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
      margin: 0 0 14px;
    }

    .er-grid {
      display: flex;
      gap: 60px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .er-col { flex: 1; min-width: 240px; }

    .er-col-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-accent);
      margin: 0 0 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--color-border);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .er-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 2px 8px;
      font-size: 0.78rem;
      color: var(--color-accent);
      border-bottom: 1px solid var(--color-border-light);
      background: #fff;
    }

    .er-row.subtotal {
      background: #f0f5f9;
      font-weight: 700;
      border-bottom: 1px solid var(--color-border);
    }

    .er-row.jahresergebnis {
      background: #fef9e7;
      font-weight: 700;
      border-bottom: 1px solid #f0d060;
    }

    .er-val {
      min-width: 36px;
      text-align: right;
      font-weight: 600;
      flex-shrink: 0;
    }

    .er-row.subtotal .er-val,
    .er-row.jahresergebnis .er-val { font-weight: 800; }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="310-abschluss.html"
  data-next="330-bilanz.html"
  data-spielzug-label="Spielzug 33"
  data-step-current="33"
  data-step-total="20"
  data-wirkung="00-wirkungen.png"
  data-disable-bank="true"
  data-disable-ereignis="true"
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- Erfolgsrechnung -->
      <section class="er-col-wrap">
        <div class="er-grid" id="er-grid"></div>
      </section>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function boldQuotes(t) { return (t||'').replace(/"([^"]+)"/g, '<strong>"$1"</strong>'); }

    /* ══ Erfolgsrechnung aufbauen ════════════════════════════════════════ */
    (function() {
      const er   = getLS('erfolgsrechnung') || {};
      const grid = document.getElementById('er-grid');

      function v(key, def) {
        const x = er[key];
        return (x !== undefined && x !== null) ? x : def;
      }
      function fmt(n) {
        return (n === null || n === undefined || n === '') ? '' : n;
      }
      function row(label, val, cls='') {
        return `<div class="er-row ${cls}">
          <span>${label}</span>
          <span class="er-val">${fmt(val)}</span>
        </div>`;
      }

      /* Berechnete Felder */
      const done29         = localStorage.getItem('done_spz29') === 'true';
      const abschreibungen = done29 ? (v('Abschreibungen', 0) || 0) : 0;
      const totalBetrieb = (v('Ertraege_Spitalbetrieb',0)||0) + (v('Andere_Ertraege',0)||0) + (v('Ausserordentliche_Ertraege',0)||0);
      const totalVar     = Math.round((v('Variable_Kosten_Spital',0)||0) + (v('Variable_Kosten_Medikamente',0)||0) - (v('Variable_Kostenreduktion',0)||0));
      const db1          = totalBetrieb - totalVar;
      const totalFix     = (v('Personalaufwand',0)||0) + (v('Personalaufwand_Extern',0)||0) + (v('Kosten_Projekte',0)||0) + (v('Lebensmittel',0)||0) + (v('Unterhalt',0)||0) + (v('Energie',0)||0) + (v('Buero',0)||0) + (v('Rekrutierung',0)||0) + (v('Ausserordentliche',0)||0);
      const ebitdar      = db1 - totalFix;
      const ebit         = ebitdar - (v('Mietzins',0)||0) - abschreibungen;
      const zinsen       = v('Zinsen_Bank', 0);
      const ebt          = ebit - zinsen;
      const steuern      = v('Steuern', 0) || 0;
      const jahresergebnis = ebt - steuern;

      /* Linke Spalte: Erträge + Variable Kosten */
      const colLeft = document.createElement('div');
      colLeft.className = 'er-col';
      colLeft.innerHTML = `
        <p class="er-col-title">Erträge</p>
        ${row('Erträge aus Spitalbetrieb',        fmt(v('Ertraege_Spitalbetrieb', 0)))}
        ${row('Andere betriebliche Erträge',       fmt(v('Andere_Ertraege', 0)))}
        ${row('Ausserordentliche Erträge',         fmt(v('Ausserordentliche_Ertraege', 0)))}
        ${row('TOTAL Betriebsertrag (gerundet)',   totalBetrieb, 'subtotal')}
        <p class="er-col-title" style="margin-top:18px;">Aufwände</p>
        ${row('Variable Kosten aus Spitalbetrieb',         fmt(v('Variable_Kosten_Spital', 0)))}
        ${row('Variable Kosten für Medikamente / Material', fmt(v('Variable_Kosten_Medikamente', 0)))}
        ${row('Variable Kostenreduktion',                  fmt(v('Variable_Kostenreduktion', 0)))}
        ${row('TOTAL Variable Kosten (gerundet)',          totalVar, 'subtotal')}
        ${row('DECKUNGSBEITRAG 1',                         db1, 'subtotal')}
        <div style="margin-top:40px;">
          <span style="font-size:1.9rem; font-weight:700; color:var(--color-label); border-top:1px solid var(--color-border); border-right:1px solid var(--color-border); border-bottom:1px solid var(--color-border); border-top-right-radius:8px; border-bottom-right-radius:8px; padding:8px 20px 8px 16px; display:inline-block; box-shadow:4px 4px 10px rgba(0,0,0,0.12);">Erfolgsrechnung</span>
        </div>
      `;

      /* Rechte Spalte: Fixkosten + EBIT + Jahresergebnis */
      const colRight = document.createElement('div');
      colRight.className = 'er-col';
      colRight.innerHTML = `
        <p class="er-col-title">Aufwände</p>
        ${row('Personalaufwand für Mitarbeitende',              fmt(v('Personalaufwand', 0)))}
        ${row('Personalaufwand temporär',                         fmt(v('Personalaufwand_Extern', 0)))}
        ${row('Kosten aller Projekte des laufenden Jahres',     fmt(v('Kosten_Projekte', null)))}
        ${row('Lebensmittel und Haushaltaufwand',               fmt(v('Lebensmittel', null)))}
        ${row('Unterhalt und Reparaturen',                      fmt(v('Unterhalt', null)))}
        ${row('Energie, Gas, Wasser, Entsorgung',               fmt(v('Energie', null)))}
        ${row('Büro- und Verwaltungsaufwand',                   fmt(v('Buero', null)))}
        ${row('Rekrutierungskosten',                            fmt(v('Rekrutierung', null)))}
        ${row('Ausserordentliche Aufwände',                     fmt(v('Ausserordentliche', null)))}
        ${row('TOTAL Fixkosten',                                totalFix, 'subtotal')}
        ${row('EBITDAR – Erfolg vor Zinsen, Steuern, Abschr., Mieten', ebitdar, 'subtotal')}
        ${row('Mietzinsaufwand',                                fmt(v('Mietzins', null)))}
        ${row('Abschreibungen (Infrastruktur und Gebäude)',     done29 ? fmt(abschreibungen) : '')}
        ${row('EBIT',                                           ebit, 'subtotal')}
        ${row('Zinsen für Bankdarlehen',                        zinsen)}
        ${row('EBT – Gewinn vor Steuern',                      ebt, 'subtotal')}
        ${row('Steuern',                                        steuern)}
        ${row('Jahresergebnis',                                 jahresergebnis, 'jahresergebnis')}
      `;

      grid.appendChild(colLeft);
      grid.appendChild(colRight);

      /* Werte global merken für Export */
      window._erExport = {
        Ertraege_Spitalbetrieb:    v('Ertraege_Spitalbetrieb', 0),
        Andere_Ertraege:           v('Andere_Ertraege', 0),
        Ausserordentliche_Ertraege:v('Ausserordentliche_Ertraege', 0),
        TOTAL_Betriebsertrag:      totalBetrieb,
        Variable_Kosten_Spital:    v('Variable_Kosten_Spital', 0),
        Variable_Kosten_Medikamente: v('Variable_Kosten_Medikamente', 0),
        Variable_Kostenreduktion:  v('Variable_Kostenreduktion', 0),
        TOTAL_Variable_Kosten:     totalVar,
        Deckungsbeitrag_1:         db1,
        Personalaufwand:           v('Personalaufwand', 0),
        Personalaufwand_Extern:    v('Personalaufwand_Extern', 0),
        Kosten_Projekte:           v('Kosten_Projekte', 0),
        Lebensmittel:              v('Lebensmittel', 0),
        Unterhalt:                 v('Unterhalt', 0),
        Energie:                   v('Energie', 0),
        Buero:                     v('Buero', 0),
        Rekrutierung:              v('Rekrutierung', 0),
        Ausserordentliche_Aufwaende: v('Ausserordentliche', 0),
        TOTAL_Fixkosten:           totalFix,
        EBITDAR:                   ebitdar,
        Mietzins:                  v('Mietzins', 0),
        Abschreibungen:            abschreibungen,
        EBIT:                      ebit,
        Zinsen_Bank:               zinsen,
        EBT:                       ebt,
        Steuern:                   steuern,
        Jahresergebnis:            jahresergebnis
      };
    })();

  </script>
</body>
</html>
