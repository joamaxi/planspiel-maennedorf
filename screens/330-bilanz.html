<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilanz – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 80px 24px;
    }

    .section-label {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
      margin: 0 0 14px;
    }

    /* ══ Bilanz-Grid ══════════════════════════════════════════════════════ */
    .bilanz-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .bilanz-card {
      flex: 1;
      min-width: 280px;
      background: #fff;
      padding: 16px 18px;
    }

    .bilanz-card-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--color-accent);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--color-border-light);
    }

    .bil-section-head {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--color-accent);
      padding: 8px 0 3px;
      margin-top: 4px;
      border-bottom: 1px solid var(--color-border);
    }

    .bil-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1px 0;
      font-size: 0.78rem;
      color: #555;
      border-bottom: 1px solid var(--color-border-light);
    }
    .bil-row:last-child { border-bottom: none; }

    .bil-val { font-weight: 600; color: var(--color-accent); }

    .bil-row.bil-total {
      font-weight: 700;
      color: var(--color-accent);
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      padding: 5px 0;
    }
    .bil-row.bil-total .bil-val { font-weight: 800; }
    .bil-row.bil-grand { margin-top: 2px; }

    .bil-row.bil-highlight {
      background: #fff3cc;
      border-radius: 4px;
      padding: 4px 4px;
    }
    .bil-row.bil-highlight .bil-val { font-weight: 800; }

    .bil-spacer { height: 10px; }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="320-erfolgsrechnung.html"
  data-next="340-aufgabe.html"
  data-spielzug-label="Spielzug 34"
  data-step-current="34"
  data-step-total="20"
  data-wirkung="00-wirkungen.png"
  data-disable-bank="true"
  data-disable-ereignis="true"
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <div class="bilanz-grid" id="bilanz-grid"></div>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }

    /* ══ Bilanz aufbauen ═════════════════════════════════════════════════ */
    (function() {
      const bilanzData = getLS('bilanzStart');
      if (!bilanzData) return;

      const arr    = bilanzData.Anfangsbilanz || bilanzData;
      const teamNr = Number(localStorage.getItem('teamNumber')) || 1;
      const entry  = arr[teamNr] ?? arr[teamNr-1] ?? arr[0];
      if (!entry?.Bilanz) return;

      const b = entry.Bilanz;
      const n = k => Number(b[k]) || 0;

      /* ── Anlagevermögen: Investitionen + Abschreibungen direkt berechnen ── */
      const infraStart = n('Infrastruktur_Anlage');
      const gebStart   = n('Gebaude_Anlage');
      const rateInfra  = Number(entry.AbschreibungMaschinen) || 0;
      const rateGeb    = Number(entry.AbschreibungGebaude) || 0;
      const reduktionsSatz = Number(entry.Abschreibungsreduktion) || 0;

      const _entsch  = getLS('projektEntscheide') || {};
      const _rawPrj  = getLS('projekte');
      const _allRecs = _rawPrj ? (_rawPrj.projekte || _rawPrj) : [];
      const _pMap    = {};
      _allRecs.forEach(r => { if (!_pMap[r.projektNr]) _pMap[r.projektNr] = []; _pMap[r.projektNr].push(r); });
      const _currentRunde = Number(localStorage.getItem('rundeNumber')) || 1;

      let investInfra = 0, investGeb = 0;
      let rateInfraEff = rateInfra;
      Object.entries(_entsch).forEach(([nr, ent]) => {
        if (!ent.levelKosten) return;
        /* Mehrperioden-Projekte aus einer Vorrunde sind bereits in der
           Bilanz-Basis enthalten — nicht nochmals als Investition
           dieser Runde zählen. */
        if (ent.projektPeriode > 1 && ent.gewaehltInRunde !== _currentRunde) return;
        const recs = _pMap[Number(nr)] || [];
        const rec  = recs.find(r => r.levelKosten === ent.levelKosten && r.levelBezeichnung === ent.levelBezeichnung)
                  || recs.find(r => r.levelKosten === ent.levelKosten);
        if (!rec) return;
        (rec.optionen || []).forEach(o => {
          if (o.name === 'Abschreibung Maschinen')       investInfra  += ent.levelKosten;
          if (o.name === 'Abschreibung Gebäude')         investGeb    += ent.levelKosten;
          if (o.name === 'Abschreibreduktion Maschinen') rateInfraEff  = reduktionsSatz || rateInfra;
        });
      });

      const done29      = localStorage.getItem('done_spz29') === 'true';
      const infraInv    = investInfra;
      const infraAbschr = done29 ? Math.round((infraStart + infraInv) * rateInfraEff / 100) : 0;
      const infraEnde   = infraStart + infraInv - infraAbschr;

      const gebInv      = investGeb;
      const gebAbschr   = done29 ? Math.round((gebStart + gebInv) * rateGeb / 100) : 0;
      const gebEnde     = gebStart + gebInv - gebAbschr;

      const anlage = infraEnde + gebEnde;

      /* ── Umlaufvermögen: FluessigeMittel + Vorraete direkt aus spz-32-Eingabe ── */
      const spz32 = getLS('spz32Eingaben') || {};
      const fluessig = Number(spz32.fluessig) || 0;
      const vorraete = Number(spz32.vorraete) || 0;
      const umlauf      = fluessig + n('Forderungen') + n('Aktive_Rechnungsabgrenzung') + vorraete;
      const totalAktiven = umlauf + anlage;

      /* ── Passiva ── */
      const fremdkapital     = n('Verbindlichkeiten') + n('Passive_Rechnungsabgrenzung') + n('Ruckstellungen') + n('Darlehen_Bank');
      const reingewinn       = totalAktiven - fremdkapital - n('Eigenkapital');
      const eigenkapitalTotal = n('Eigenkapital') + reingewinn;
      const totalPassiven    = fremdkapital + eigenkapitalTotal;

      function show(v) { return (v === null || v === undefined) ? 0 : v; }
      function sec(label)   { return `<div class="bil-section-head">${label}</div>`; }
      function spacer()     { return `<div class="bil-spacer"></div>`; }
      function row(label, val, cls='') {
        return `<div class="bil-row ${cls}"><span>${label}</span><span class="bil-val">${val !== '' ? val : ''}</span></div>`;
      }

      const grid = document.getElementById('bilanz-grid');

      /* AKTIVA */
      const aktivaCard = document.createElement('div');
      aktivaCard.className = 'bilanz-card';
      aktivaCard.innerHTML = `
        <div class="bilanz-card-title">AKTIVA</div>
        ${sec('Umlaufvermögen')}
        ${row('Flüssige Mittel', show(fluessig))}
        ${row('Forderungen aus Lieferungen und Leistungen (Debitoren)', show(n('Forderungen')))}
        ${row('Aktive Rechnungsabgrenzung', show(n('Aktive_Rechnungsabgrenzung')))}
        ${row('Warenvorräte (Medikamente und Material)', show(vorraete))}
        ${row('TOTAL Umlaufvermögen', umlauf, 'bil-total')}
        ${spacer()}
        ${sec('Anlagevermögen')}
        ${row('Anlagevermögen Infrastruktur zu Beginn des Jahres', show(infraStart))}
        ${row('Investitionen Infrastruktur in diesem Jahr', show(infraInv))}
        ${row('Abschreibungen Infrastruktur in diesem Jahr', show(infraAbschr))}
        ${row('Anlagevermögen Infrastruktur am Ende des Jahres', infraEnde)}
        ${spacer()}
        ${row('Anlagevermögen Gebäude zu Beginn des Jahres', show(gebStart))}
        ${row('Investitionen Gebäude in diesem Jahr', show(gebInv))}
        ${row('Abschreibungen Gebäude in diesem Jahr', show(gebAbschr))}
        ${row('Anlagevermögen Gebäude am Ende des Jahres', gebEnde)}
        ${row('TOTAL Anlagevermögen', anlage, 'bil-total')}
        ${row('TOTAL Aktiven', totalAktiven, 'bil-total bil-grand')}
      `;

      /* PASSIVA */
      const passivaCard = document.createElement('div');
      passivaCard.className = 'bilanz-card';
      passivaCard.innerHTML = `
        <div class="bilanz-card-title">PASSIVA</div>
        ${sec('Fremdkapital')}
        ${row('Verbindlichkeiten (Kreditoren)', show(n('Verbindlichkeiten')))}
        ${row('Passive Rechnungsabgrenzung', show(n('Passive_Rechnungsabgrenzung')))}
        ${row('Rückstellungen', show(n('Ruckstellungen')))}
        ${row('Bankdarlehen', show(n('Darlehen_Bank')))}
        ${row('TOTAL Fremdkapital', fremdkapital, 'bil-total')}
        ${spacer()}
        ${sec('Eigenkapital')}
        ${row('Eigenkapital', show(n('Eigenkapital')))}
        ${row('Reingewinn/-verlust', reingewinn, 'bil-highlight')}
        ${row('TOTAL Eigenkapital', eigenkapitalTotal, 'bil-total')}
        ${row('TOTAL Passiven', totalPassiven, 'bil-total bil-grand')}
        <div style="margin-top:40px; display:flex; justify-content:flex-end;">
          <span style="font-size:1.9rem; font-weight:700; color:var(--color-label); border-top:1px solid var(--color-border); border-left:1px solid var(--color-border); border-bottom:1px solid var(--color-border); border-top-left-radius:8px; border-bottom-left-radius:8px; padding:8px 16px 8px 20px; display:inline-block; box-shadow:-4px 4px 10px rgba(0,0,0,0.12);">Bilanz</span>
        </div>
      `;

      grid.appendChild(aktivaCard);
      grid.appendChild(passivaCard);

      /* Endwerte für Export merken */
      window._bilanzEndwerte = {
        bilanzData, arr, teamNr,
        infraEnde, gebEnde, fluessig, vorraete,
        eigenkapitalTotal,
        forderungen:  n('Forderungen'),
        aktRa:        n('Aktive_Rechnungsabgrenzung'),
        verbindlich:  n('Verbindlichkeiten'),
        passRa:       n('Passive_Rechnungsabgrenzung'),
        rueckst:      n('Ruckstellungen'),
        darlehen:     n('Darlehen_Bank'),
        eigenkapital: n('Eigenkapital'),
        immateriell:  n('Immaterielle_Werte_Anlage')
      };
    })();

    /* ══ Verlassen: Bilanz als JSON für nächste Runde speichern ══════════ */
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#nav-next')) return;

      const exp = window._bilanzEndwerte;
      if (!exp || !exp.bilanzData) return;

      const team  = localStorage.getItem('teamNumber')  || '0';
      const runde = localStorage.getItem('rundeNumber') || '1';

      /* Eintrag deep-kopieren und Endwerte einsetzen */
      const arr      = exp.arr;
      const idx      = arr[exp.teamNr] !== undefined ? exp.teamNr
                     : (arr[exp.teamNr - 1] !== undefined ? exp.teamNr - 1 : 0);
      const newEntry = JSON.parse(JSON.stringify(arr[idx]));

      newEntry.Bilanz.Infrastruktur_Anlage         = exp.infraEnde;
      newEntry.Bilanz.Gebaude_Anlage               = exp.gebEnde;
      newEntry.Bilanz.FluessigeMittel              = exp.fluessig;
      newEntry.Bilanz.Vorraete                     = exp.vorraete;
      newEntry.Bilanz.Eigenkapital                 = exp.eigenkapitalTotal;
      /* Investitions- und Abschreibungsfelder für neue Runde zurücksetzen */
      newEntry.Bilanz.Investitionen_Infrastruktur  = 0;
      newEntry.Bilanz.Investitionen_Gebaeude       = 0;
      newEntry.Bilanz.Abschreibungen_Infrastruktur = 0;
      newEntry.Bilanz.Abschreibungen_Gebaeude      = 0;

      /* Summenfelder neu berechnen */
      const nb  = newEntry.Bilanz;
      const nbn = k => Number(nb[k]) || 0;
      const totUmlauf  = nbn('FluessigeMittel') + nbn('Forderungen') + nbn('Aktive_Rechnungsabgrenzung') + nbn('Vorraete');
      const totAnlage  = nbn('Infrastruktur_Anlage') + nbn('Gebaude_Anlage') + nbn('Immaterielle_Werte_Anlage');
      const totAktiven = totUmlauf + totAnlage;
      const totFremd   = nbn('Verbindlichkeiten') + nbn('Passive_Rechnungsabgrenzung') + nbn('Ruckstellungen') + nbn('Darlehen_Bank');
      const totPassiv  = totFremd + nbn('Eigenkapital');

      nb.TOTAL_Umlaufvermoegen  = totUmlauf;
      nb['TOTAL_Anlagevermögen'] = totAnlage;
      nb.TOTAL_Anlage           = totAnlage;
      nb.TOTAL_Aktiven          = totAktiven;
      nb.Fremdkapital           = totFremd;
      nb.TOTAL_Passiven         = totPassiv;

      /* Zinssatz für nächste Runde um 1% erhöhen */
      newEntry.BankZinsen = (Number(newEntry.BankZinsen) || 3) + 1;

      const newArr     = [...arr];
      newArr[idx]      = newEntry;
      const exportData = exp.bilanzData.Anfangsbilanz
        ? { ...exp.bilanzData, Anfangsbilanz: newArr }
        : newArr;

      const teamName = localStorage.getItem('klinikName') || '';

      /* Erfolgsrechnung aus localStorage für eBilanz */
      const er = getLS('erfolgsrechnung') || {};
      function erV(k) { const x = er[k]; return (x !== undefined && x !== null) ? Number(x) || 0 : 0; }
      const done29         = localStorage.getItem('done_spz29') === 'true';
      const er_abschr      = done29 ? (erV('Abschreibungen') || 0) : 0;
      const er_totalBetrieb = erV('Ertraege_Spitalbetrieb') + erV('Andere_Ertraege') + erV('Ausserordentliche_Ertraege');
      const er_totalVar     = Math.round(erV('Variable_Kosten_Spital') + erV('Variable_Kosten_Medikamente') - erV('Variable_Kostenreduktion'));
      const er_db1          = er_totalBetrieb - er_totalVar;
      const er_totalFix     = erV('Personalaufwand') + erV('Personalaufwand_Extern') + erV('Kosten_Projekte') + erV('Lebensmittel') + erV('Unterhalt') + erV('Energie') + erV('Buero') + erV('Rekrutierung') + erV('Ausserordentliche');
      const er_ebitdar      = er_db1 - er_totalFix;
      const er_ebit         = er_ebitdar - erV('Mietzins') - er_abschr;
      const er_ebt          = er_ebit - erV('Zinsen_Bank');
      const er_jahresergebnis = er_ebt - erV('Steuern');

      /* eBilanz: Endwerte der aktuellen Runde für FileMaker */
      const eBilanzData = {
        teamNr:   Number(team),
        teamName: teamName,
        rundeNr:  Number(runde),
        Bilanz: {
          Infrastruktur_Anlage:         exp.infraEnde,
          Gebaude_Anlage:               exp.gebEnde,
          FluessigeMittel:              exp.fluessig,
          Vorraete:                     exp.vorraete,
          Forderungen:                  exp.forderungen,
          Aktive_Rechnungsabgrenzung:   exp.aktRa,
          Immaterielle_Werte_Anlage:    exp.immateriell,
          TOTAL_Umlaufvermoegen:        totUmlauf,
          TOTAL_Anlagevermögen:         totAnlage,
          TOTAL_Aktiven:                totAktiven,
          Verbindlichkeiten:            exp.verbindlich,
          Passive_Rechnungsabgrenzung:  exp.passRa,
          Ruckstellungen:               exp.rueckst,
          Darlehen_Bank:                exp.darlehen,
          Fremdkapital:                 totFremd,
          Eigenkapital:                 exp.eigenkapitalTotal,
          TOTAL_Passiven:               totPassiv
        },
        Erfolgsrechnung: {
          Ertraege_Spitalbetrieb:       erV('Ertraege_Spitalbetrieb'),
          Andere_Ertraege:              erV('Andere_Ertraege'),
          Ausserordentliche_Ertraege:   erV('Ausserordentliche_Ertraege'),
          TOTAL_Betriebsertrag:         er_totalBetrieb,
          Variable_Kosten_Spital:       erV('Variable_Kosten_Spital'),
          Variable_Kosten_Medikamente:  erV('Variable_Kosten_Medikamente'),
          Variable_Kostenreduktion:     erV('Variable_Kostenreduktion'),
          TOTAL_Variable_Kosten:        er_totalVar,
          Deckungsbeitrag_1:            er_db1,
          Personalaufwand:              erV('Personalaufwand'),
          Personalaufwand_Extern:       erV('Personalaufwand_Extern'),
          Kosten_Projekte:              erV('Kosten_Projekte'),
          Lebensmittel:                 erV('Lebensmittel'),
          Unterhalt:                    erV('Unterhalt'),
          Energie:                      erV('Energie'),
          Buero:                        erV('Buero'),
          Rekrutierung:                 erV('Rekrutierung'),
          Ausserordentliche_Aufwaende:  erV('Ausserordentliche'),
          TOTAL_Fixkosten:              er_totalFix,
          EBITDAR:                      er_ebitdar,
          Mietzins:                     erV('Mietzins'),
          Abschreibungen:               er_abschr,
          EBIT:                         er_ebit,
          Zinsen_Bank:                  erV('Zinsen_Bank'),
          EBT:                          er_ebt,
          Steuern:                      erV('Steuern'),
          Jahresergebnis:               er_jahresergebnis
        }
      };

      const filenameA = `team${team}-runde${Number(runde) + 1}-aBilanz.json`;
      const filenameE = `team${team}-runde${runde}-eBilanz.json`;

      fetch('../data/json/save.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: filenameA, data: JSON.stringify(exportData, null, 2) }),
        keepalive: true
      }).catch(err => console.error('Bilanz-Export (aBilanz) fehlgeschlagen:', err));

      fetch('../data/json/save.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: filenameE, data: JSON.stringify(eBilanzData, null, 2) }),
        keepalive: true
      }).catch(err => console.error('Bilanz-Export (eBilanz) fehlgeschlagen:', err));
    }, true);
  </script>
</body>
</html>
