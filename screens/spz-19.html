<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patientenkosten – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      padding: 60px 32px 24px 32px;
      display: flex;
      gap: 60px;
      align-items: flex-start;
    }

    /* ══ LINKE SPALTE ══════════════════════════════════════════════════════ */
    .col-left {
      width: 300px;
      flex-shrink: 0;
    }

    .decision-card {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 20px 28px 20px;
      background: #fff;
      margin-top: 120px;
    }

    .card-illustration {
      position: absolute;
      top: -28px;
      right: 12px;
      height: 52px;
      width: auto;
      display: block;
      background: #fff;
    }

    .card-title {
      font-weight: 800;
      color: var(--color-accent);
      margin: 0 0 12px 0;
      line-height: 1.1;
    }

    .card-text {
      font-size: 0.86rem;
      color: #333;
      line-height: 1.6;
      margin: 0;
    }

    /* ══ RECHTE SPALTE ═════════════════════════════════════════════════════ */
    .col-right {
      flex: 1;
      min-width: 0;
    }

    /* L-Rahmen */
    .kosten-wrapper {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 20px 28px 20px;
      margin-top: 120px;   /* Platz für Titel + Subtitle */
    }

    .kosten-wrapper-title {
      position: absolute;
      top: -60px;
      left: 0;
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
      white-space: nowrap;
      padding: 0 0 0 20px;
    }

    .kosten-wrapper-subtitle {
      position: absolute;
      top: -26px;
      left: 0;
      font-size: 0.78rem;
      color: var(--color-label-light);
      padding: 0 0 0 22px;
      white-space: nowrap;
    }

    /* ── Inneres Layout: Label links + Boxen rechts ─────────────────────── */
    .kosten-inner {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Zeilen-Beschriftung links */
    .kosten-row-label {
      flex-shrink: 0;
      text-align: right;
      min-width: 120px;
    }

    .kosten-row-main {
      display: block;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--color-accent);
      line-height: 1.3;
    }

    .kosten-row-sub {
      display: block;
      font-size: 0.75rem;
      color: var(--color-label);
      margin-top: 2px;
    }

    /* Bereich-Boxen */
    .kosten-grid {
      display: flex;
      gap: 12px;
      flex: 1;
    }

    .kosten-box {
      flex: 1;
      border-radius: 10px;
      border: 2px solid transparent;
      overflow: hidden;
    }

    /* Farbiger Header-Balken wie spz-10 */
    .kosten-box-name {
      padding: 8px 12px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .kosten-body {
      padding: 12px 12px 14px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .kosten-sublabel {
      font-size: 0.75rem;
      color: var(--color-label);
      text-align: center;
      line-height: 1.3;
    }

    /* Badge in Akzentblau */
    .kosten-badge {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      background: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="spz-18.html"
  data-next="spz-20.html"
  data-spielzug-label="Spielzug 19"
  data-step-current="19"
  data-step-total="20"
  data-wirkung="00-wirkungen.png"
  data-disable-handbuch="true"
  
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- ══ LINKE SPALTE ══ -->
      <div class="col-left">
        <div class="decision-card">
          <img id="card-picto-1" src="../assets/pictos/picto_aufgabe.png"
               class="card-illustration" alt="" />
          <h1 class="card-title" id="art-1">Aufgabe</h1>
          <p class="card-text" id="text-1"></p>
        </div>
      </div>

      <!-- ══ RECHTE SPALTE ══ -->
      <div class="col-right">

        <div class="kosten-wrapper">

          <span class="kosten-wrapper-title">Aktive Rechnungsabgrenzung</span>
          <span class="kosten-wrapper-subtitle">
            Leistungen der stationären Patienten, die in dieser Periode noch NICHT verrechnet werden können
          </span>

          <div class="kosten-inner">

            <!-- Bereichs-Boxen: dynamisch aus marktStart befüllt -->
            <div class="kosten-grid" id="kosten-grid"></div>

          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; }
    }
    function setLS(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }
    function boldQuotes(text) {
      return text.replace(/"([^"]+)"/g, '<strong>"$1"</strong>');
    }

    /* ══ Spielaufgaben → linke Karte ══════════════════════════════════════ */
    (function() {
      const data = getLS('spielaufgaben');
      if (!data) return;
      const arr  = data.spielaufgaben || data;
      const item = arr.find(e => e.screenFile === location.pathname.split('/').pop());
      if (!item) return;

      if (item.AufgabenArt_1) document.getElementById('art-1').textContent = item.AufgabenArt_1;
      const parts = (item.Aufgabe_1 || '').split('\r');
      const body  = parts.length > 1 ? parts.slice(1).join(' ').trim() : parts[0].trim();
      document.getElementById('text-1').innerHTML = boldQuotes(body);

      if (item.Picto1)
        document.getElementById('card-picto-1').src = `../assets/pictos/${item.Picto1.toLowerCase()}`;
    })();

    /* ══ Aktive Rechnungsabgrenzung: anzahl × kostenTotal pro Bereich ════ */
    (function() {
      /* Fallback falls marktStart noch nicht importiert wurde */
      const FALLBACK_STAT = [
        { marktName: 'Medizin',      marktNr: 1, rgb: '230,51,41'  },
        { marktName: 'Chirurgie',    marktNr: 2, rgb: '249,178,51' },
        { marktName: 'Geburtshilfe', marktNr: 3, rgb: '58,170,53'  },
      ];

      const marktData = getLS('marktStart');
      const raw       = marktData ? (marktData.markt || marktData.Marktbereiche || marktData) : [];
      const alle      = (Array.isArray(raw) && raw.length > 0) ? raw : FALLBACK_STAT;
      const bereiche  = alle.filter(b => (b.marktNr || 0) < 4 && b.marktName !== 'Ambulant');
      const stationaere = bereiche.length > 0 ? bereiche : FALLBACK_STAT;

      /* kostenTotal pro Bereich (Allgemein) aus patienten JSON – Schlüssel = marktNr */
      const kostenRate = {};
      stationaere.forEach(b => { kostenRate[b.marktNr] = 0; });

      const rawPat = getLS('patienten');
      const eintraege = rawPat
        ? (Array.isArray(rawPat) ? rawPat : (Array.isArray(rawPat.patienten) ? rawPat.patienten : []))
        : [];
      eintraege.forEach(e => {
        if (e.versicherung !== 'Allgemein') return;
        if (e.marktNr in kostenRate) kostenRate[e.marktNr] = Number(e.kostenTotal) || kostenRate[e.marktNr];
      });

      /* Anzahl aus startPatienten (spz-2) – Schlüssel = marktNr */
      const spData      = getLS('startPatienten');
      const startAuftrag = spData ? (spData.startauftrag || spData) : [];
      const anzahl = {};
      stationaere.forEach(b => { anzahl[b.marktNr] = 0; });
      (Array.isArray(startAuftrag) ? startAuftrag : []).forEach(e => {
        if (e.versicherung !== 'Allgemein') return;
        if (e.marktNr in anzahl) anzahl[e.marktNr] = Number(e.anzahl) || 0;
      });

      /* Aktive Rechnungsabgrenzung = anzahl × kostenTotal, Boxen dynamisch bauen */
      const grid  = document.getElementById('kosten-grid');
      const werte = {};
      let total   = 0;

      stationaere.forEach(b => {
        const rgb  = b.rgb || '160,184,200';
        const wert = (anzahl[b.marktNr] || 0) * (kostenRate[b.marktNr] || 0);
        werte[b.marktNr] = wert;
        total += wert;

        const box = document.createElement('div');
        box.className = 'kosten-box';
        box.style.borderColor = `rgb(${rgb})`;
        box.innerHTML = `
          <div class="kosten-box-name" style="background:rgb(${rgb});">${b.marktName}</div>
          <div class="kosten-body">
            <div class="kosten-badge">${wert}</div>
          </div>
        `;
        grid.appendChild(box);
      });

      /* Werte speichern (Schlüssel = marktNr) */
      localStorage.setItem('spz19_aktiveRechnung', total);
      setLS('spz19_bereiche', werte);
    })();

    /* ══ Transfer beim Next-Klick ════════════════════════════════════════ */
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#nav-next')) return;
      if (localStorage.getItem('done_spz19_patientenkosten') === 'true') return;

      const total = Number(localStorage.getItem('spz19_aktiveRechnung')) || 0;
      if (total === 0) { localStorage.setItem('done_spz19_patientenkosten', 'true'); return; }

      /* Bilanz: FluessigeMittel -= total */
      const bilanzData = getLS('bilanzStart');
      if (bilanzData) {
        const arr    = bilanzData.Anfangsbilanz || bilanzData;
        const teamNr = Number(localStorage.getItem('teamNumber')) || 1;
        const idx    = arr[teamNr] !== undefined ? teamNr : (arr[teamNr-1] !== undefined ? teamNr-1 : 0);
        const entry  = arr[idx];
        if (entry && entry.Bilanz) {
          entry.Bilanz.FluessigeMittel = (Number(entry.Bilanz.FluessigeMittel) || 0) - total;
          arr[idx] = entry;
          localStorage.setItem('bilanzStart', JSON.stringify(
            bilanzData.Anfangsbilanz ? { ...bilanzData, Anfangsbilanz: arr } : arr
          ));
        }
      }

      /* Erfolgsrechnung: Variable Kosten Spital += total */
      const er = getLS('erfolgsrechnung') || {};
      er.Variable_Kosten_Spital = (Number(er.Variable_Kosten_Spital) || 0) + total;
      setLS('erfolgsrechnung', er);

      /* Protokoll */
      const teamNr    = Number(localStorage.getItem('teamNumber')) || 1;
      const teamLabel = localStorage.getItem('klinikName') || `Team ${teamNr}`;
      const protokoll = getLS('protokoll') || [];
      protokoll.push({
        zeit:     new Date().toISOString(),
        spielzug: 'spz-19',
        aktion:   'Aktive Rechnungsabgrenzung',
        von:      'Flüssige Mittel',
        nach:     'Aktive Rechnungsabgrenzung',
        betrag:   total,
        team:     teamLabel
      });
      setLS('protokoll', protokoll);

      localStorage.setItem('done_spz19_patientenkosten', 'true');
    }, true);
  </script>
</body>
</html>
