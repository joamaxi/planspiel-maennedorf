<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projektzusammenfassung – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 60px 28px 24px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 35px;
      align-items: start;
    }

    /* ══ Spielaufgabe (linke Spalte) ═════════════════════════════════════ */
    .task-col {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding-top: 60px;
    }

    .task-card {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 18px 22px;
      background: #fff;
      margin-top: 28px;
    }

    .task-card-icon {
      position: absolute;
      top: -26px; right: 10px;
      height: 48px; width: auto;
      display: block;
    }

    .task-card-title {
      font-weight: 800;
      color: var(--color-accent);
      margin: 0 0 9px;
      font-size: 0.95rem;
      line-height: 1.1;
    }

    .task-card-text {
      font-size: 0.82rem;
      color: #333;
      line-height: 1.6;
      margin: 0;
    }

    /* ══ Zusammenfassung (rechte Spalte) ══════════════════════════════════ */
    .summary-col {
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .summary-title {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
      margin: 0 0 16px;
      line-height: 1.15;
      flex-shrink: 0;
    }

    .summary-table-wrap {
      border: 1px solid var(--color-border);
      border-radius: 10px;
      overflow-y: scroll;
      max-height: 420px;
      flex-shrink: 0;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .summary-table thead th {
      position: sticky;
      top: 0;
      background: #f4f8fc;
      color: var(--color-label);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 9px 12px;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
      z-index: 1;
    }
    .summary-table thead th:first-child { text-align: left; min-width: 180px; }

    .summary-table tbody tr {
      border-bottom: 1px solid #eef2f6;
      transition: background 0.1s;
    }
    .summary-table tbody tr:last-child { border-bottom: none; }
    .summary-table tbody tr:hover { background: #f8fbfd; }

    .summary-table tbody td {
      padding: 10px 12px;
      text-align: center;
      color: #111;
      vertical-align: middle;
    }
    .summary-table tbody td:first-child {
      text-align: left;
      font-weight: 700;
    }

    .wirkung-empty { color: #bbb; }

    /* Total-Zeile — sticky am unteren Rand */
    .summary-table tfoot tr {
      background: #7fa8c0;
      position: sticky;
      bottom: 0;
    }
    .summary-table tfoot td {
      padding: 11px 12px;
      color: #fff;
      font-weight: 700;
      text-align: center;
      font-size: 0.88rem;
      border-top: 1px solid #6a94aa;
    }
    .summary-table tfoot td:first-child { text-align: left; }

    .empty-hint {
      padding: 40px 20px;
      text-align: center;
      color: var(--color-label-light);
      font-size: 0.9rem;
    }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="spz-25.html"
  data-next="spz-27.html"
  data-spielzug-label="Spielzug 26"
  data-step-current="26"
  data-step-total="20"
  data-wirkung="00-wirkungen.png"
  data-disable-handbuch="true"
 
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- Linke Spalte: Spielaufgabe -->
      <aside class="task-col">
        <div class="task-card">
          <img id="picto-1" src="../assets/pictos/picto_meeting.png" class="task-card-icon" alt="" />
          <h2 class="task-card-title" id="art-1">Erklärung</h2>
          <p class="task-card-text" id="text-1"></p>
        </div>
      </aside>

      <!-- Rechte Spalte: Zusammenfassung -->
      <section class="summary-col">
        <h1 class="summary-title">Zusammenfassung der Projektinvestitionen</h1>

        <div class="summary-table-wrap" id="summary-wrap">
          <div class="empty-hint">Noch keine Projekte gewählt</div>
        </div>
      </section>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function boldQuotes(t) { return (t||'').replace(/"([^"]+)"/g, '<strong>"$1"</strong>'); }

    /* ══ Spielaufgaben ═══════════════════════════════════════════════════ */
    (function() {
      const data = getLS('spielaufgaben');
      if (!data) return;
      const arr  = data.spielaufgaben || data;
      const item = arr.find(e => e.Spielzug === 'spz-26');
      if (!item) return;
      function parseBody(t) {
        const p = (t||'').split('\r');
        return p.length > 1 ? p.slice(1).join(' ').trim() : p[0].trim();
      }
      if (item.AufgabenArt_1) document.getElementById('art-1').textContent = item.AufgabenArt_1;
      document.getElementById('text-1').innerHTML = boldQuotes(parseBody(item.Aufgabe_1));
      if (item.Picto1) document.getElementById('picto-1').src = `../assets/pictos/${item.Picto1.toLowerCase()}`;
    })();

    /* ══ Projektzusammenfassung ══════════════════════════════════════════ */
    (function() {
      const WIRK_COLS = ['PAZI', 'MIZI', 'BEZI', 'ZUZI', 'EIZI'];

      const entscheide = getLS('projektEntscheide') || {};
      const raw        = getLS('projekte');
      const alleRecs   = raw ? (raw.projekte || raw) : [];

      /* Index: projektNr → records (sorted by levelKosten) */
      const projektMap = {};
      alleRecs.forEach(r => {
        const nr = r.projektNr;
        if (!projektMap[nr]) projektMap[nr] = [];
        projektMap[nr].push(r);
      });

      /* Alle Projektnummern sortiert */
      const alleProjektNrs = Object.keys(projektMap).map(Number).sort((a, b) => a - b);

      if (alleProjektNrs.length === 0) return;

      /* Wirkungswerte pro Projekt ermitteln */
      function getWirkungen(projektNr, levelKosten, levelBezeichnung) {
        const records = projektMap[projektNr] || [];
        const rec = records.find(r =>
          r.levelKosten === levelKosten && r.levelBezeichnung === levelBezeichnung
        ) || records.find(r => r.levelKosten === levelKosten);
        if (!rec) return {};
        const out = {};
        for (let i = 1; i <= 3; i++) {
          const name = rec[`wirkungName${i}`];
          const val  = rec[`wirkungWert${i}`];
          if (name) out[name] = val;
        }
        return out;
      }

      /* Investition-Label */
      function investLabel(levelBezeichnung) {
        return levelBezeichnung || '–';
      }

      /* Totals */
      let totalKosten = 0;
      const totalWirk = {};
      WIRK_COLS.forEach(k => totalWirk[k] = 0);

      /* Tabellenzeilen — alle Projekte */
      const rows = alleProjektNrs.map(nr => {
        const first = projektMap[nr][0];
        const ent   = entscheide[nr];

        if (!ent) {
          /* Nicht gewählt */
          const emptyWirk = WIRK_COLS.map(() => `<td class="wirkung-empty"></td>`).join('');
          return `<tr style="color:#bbb;">
            <td style="color:#bbb;font-weight:700;">${first.projektName}</td>
            <td class="wirkung-empty">–</td>
            <td class="wirkung-empty">–</td>
            ${emptyWirk}
          </tr>`;
        }

        totalKosten += ent.levelKosten;
        const wirk = getWirkungen(Number(nr), ent.levelKosten, ent.levelBezeichnung);

        const wirkCells = WIRK_COLS.map(col => {
          const v = wirk[col];
          if (v !== undefined && v !== '' && v !== null) {
            totalWirk[col] += Number(v) || 0;
            return `<td class="wirkung-val">${v}</td>`;
          }
          return `<td class="wirkung-empty"></td>`;
        }).join('');

        const invLabel = investLabel(ent.levelBezeichnung);

        return `<tr>
          <td>${ent.projektName}</td>
          <td>${invLabel}</td>
          <td>${ent.levelKosten}</td>
          ${wirkCells}
        </tr>`;
      }).join('');

      /* Total-Zeile */
      const totalWirkCells = WIRK_COLS.map(col =>
        `<td>${totalWirk[col] !== 0 ? totalWirk[col] : ''}</td>`
      ).join('');

      /* Spalten-Header */
      const thWirk = WIRK_COLS.map(col => `<th>${col}</th>`).join('');

      document.getElementById('summary-wrap').innerHTML = `
        <table class="summary-table">
          <thead>
            <tr>
              <th>Projekt</th>
              <th class="col-inv">Investition</th>
              <th>Kosten</th>
              ${thWirk}
            </tr>
          </thead>
          <tbody>${rows}</tbody>
          <tfoot>
            <tr>
              <td>TOTAL über alle Projekte</td>
              <td></td>
              <td>${totalKosten}</td>
              ${totalWirkCells}
            </tr>
          </tfoot>
        </table>
      `;
    })();
  </script>
</body>
</html>
