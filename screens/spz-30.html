<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bankdarlehen – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 100px 100px 24px 100px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 120px;
      align-items: start;
    }

    /* ══ Spielaufgaben (linke Spalte) ════════════════════════════════════ */
    .task-col {
      display: flex;
      flex-direction: column;
      margin-top: 20px;
      gap: 32px;
    }

    .task-card {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 18px 22px;
      background: #fff;
      margin-top: 28px;
    }

    .task-card-icon {
      position: absolute;
      top: -26px; right: 10px;
      height: 48px; width: auto;
    }

    .task-card-title {
      font-weight: 800;
      color: var(--color-accent);
      margin: 0 0 9px;
      font-size: 0.95rem;
    }

    .task-card-text {
      font-size: 0.82rem;
      color: #333;
      line-height: 1.6;
      margin: 0;
    }

    /* ══ Bank-Sektion (rechte Spalte) ═════════════════════════════════════ */
    .bank-col { padding-top: 8px; }

    .bank-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .section-label {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
    }

    .section-unit {
      font-size: 0.78rem;
      color: var(--color-label-light);
    }

    .bank-list {
      border-top: 1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-radius: 8px 0 0 0;
    }

    .bank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 14px 16px;
      border-bottom: 1px solid var(--color-border-light);
      gap: 16px;
    }
    .bank-row:last-child { border-bottom: none; }

    .bank-label {
      color: var(--color-accent);
      font-size: 0.92rem;
      font-weight: 500;
    }

    /* Eingabefeld */
    .bank-input {
      width: 110px;
      height: 40px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      outline: none;
      flex-shrink: 0;
    }
    .bank-input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 2px rgba(37,117,176,0.12); }
    .bank-input::-webkit-inner-spin-button,
    .bank-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .bank-input[type=number] { -moz-appearance: textfield; appearance: textfield; }

    /* Anzeigefeld (Zinssatz) */
    .bank-display {
      width: 110px;
      height: 40px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      background: #f4f8fc;
      color: var(--color-accent);
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Ergebnis-Badge */
    .val-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 10px;
      min-width: 110px;
      height: 40px;
      padding: 0 18px;
      flex-shrink: 0;
    }

    .bank-divider {
      height: 20px;
      border-bottom: 1px solid var(--color-border-light);
    }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="spz-29.html"
  data-next="spz-31.html"
  data-spielzug-label="Spielzug 30"
  data-step-current="30"
  data-step-total="20"
  data-wirkung="00-wirkungen.png"
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- Linke Spalte: Spielaufgabe -->
      <aside class="task-col">
        <div class="task-card">
          <img id="picto-1" src="../assets/pictos/picto_meeting.png" class="task-card-icon" alt="" />
          <h2 class="task-card-title" id="art-1">Entscheidung</h2>
          <p class="task-card-text" id="text-1"></p>
        </div>
      </aside>

      <!-- Rechte Spalte: Bankdarlehen -->
      <section class="bank-col">
        <div class="bank-header">
          <span class="section-label">Bank</span>
          <span class="section-unit">in Mio</span>
        </div>
        <div class="bank-list">
          <div class="bank-row">
            <span class="bank-label">Bankschulden</span>
            <div class="bank-display" id="disp-bankschulden">–</div>
          </div>
          <div class="bank-row">
            <span class="bank-label">Zinssatz</span>
            <div class="bank-display" id="disp-zinssatz">–</div>
          </div>
          <div class="bank-divider"></div>
          <div class="bank-row">
            <span class="bank-label">Zinsen</span>
            <span class="val-box" id="val-zinsen">–</span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function setLS(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
    function boldQuotes(t) { return (t||'').replace(/"([^"]+)"/g, '<strong>"$1"</strong>'); }
    function toNum(v) { const n = Number(String(v||'').replace(',','.')); return isFinite(n) ? n : 0; }

    /* ══ Spielaufgaben ═══════════════════════════════════════════════════ */
    (function() {
      const data = getLS('spielaufgaben');
      if (!data) return;
      const arr  = data.spielaufgaben || data;
      const item = arr.find(e => e.screenFile === location.pathname.split('/').pop());
      if (!item) return;
      function parseBody(t) {
        const p = (t||'').split('\r');
        return p.length > 1 ? p.slice(1).join(' ').trim() : p[0].trim();
      }
      if (item.AufgabenArt_1) document.getElementById('art-1').textContent = item.AufgabenArt_1;
      document.getElementById('text-1').innerHTML = boldQuotes(parseBody(item.Aufgabe_1));
      if (item.Picto1) document.getElementById('picto-1').src = `../assets/pictos/${item.Picto1.toLowerCase()}`;
    })();

    /* ══ Bilanz-Daten laden ══════════════════════════════════════════════ */
    const bilanzData  = getLS('bilanzStart');
    const bilanzArr   = bilanzData ? (bilanzData.Anfangsbilanz || bilanzData) : null;
    const teamNr      = Number(localStorage.getItem('teamNumber')) || 1;
    const bilanzIdx   = bilanzArr
      ? (bilanzArr[teamNr] !== undefined ? teamNr : (bilanzArr[teamNr-1] !== undefined ? teamNr-1 : 0))
      : 0;
    const bilanzEntry = bilanzArr ? bilanzArr[bilanzIdx] : null;
    const bilanz      = bilanzEntry?.Bilanz || {};

    const zinssatz    = Number(bilanzEntry?.BankZinsen) || 0;
    const startSchuld = Number(bilanz.Darlehen_Bank) || 0;

    /* Anzeige initialisieren */
    document.getElementById('disp-bankschulden').textContent = startSchuld || 0;
    document.getElementById('disp-zinssatz').textContent = zinssatz.toFixed(1) + ' %';

    const zinsen = Math.round(startSchuld * zinssatz / 100);
    document.getElementById('val-zinsen').textContent = zinsen;

    /* ══ Transfer beim Weiter-Klick ══════════════════════════════════════ */
    document.addEventListener('nav:next', () => {
      if (localStorage.getItem('done_spz30') === 'true') return;

      const schulden  = startSchuld;
      const er        = getLS('erfolgsrechnung') || {};
      const protokoll = getLS('protokoll')       || [];
      const teamLabel = localStorage.getItem('klinikName') || `Team ${teamNr}`;

      /* Bilanz: Darlehen_Bank aktualisieren, FluessigeMittel um Zinsen reduzieren */
      if (bilanzEntry) {
        bilanzEntry.Bilanz.Darlehen_Bank    = schulden;
        bilanzEntry.Bilanz.FluessigeMittel  = (Number(bilanzEntry.Bilanz.FluessigeMittel) || 0) - zinsen;
        bilanzArr[bilanzIdx] = bilanzEntry;
        setLS('bilanzStart', bilanzData.Anfangsbilanz
          ? { ...bilanzData, Anfangsbilanz: bilanzArr }
          : bilanzArr);
      }

      /* Erfolgsrechnung */
      er.Zinsen_Bank = (Number(er.Zinsen_Bank) || 0) + zinsen;
      setLS('erfolgsrechnung', er);

      /* Protokoll */
      protokoll.push({
        zeit: new Date().toISOString(), spielzug: 'spz-30',
        aktion: `Bankdarlehen aktualisiert (${schulden} Mio)`,
        von: '–', nach: 'Bilanz',
        betrag: schulden, team: teamLabel
      });
      if (zinsen > 0) protokoll.push({
        zeit: new Date().toISOString(), spielzug: 'spz-30',
        aktion: `Zinsen Bankdarlehen (${zinssatz}%)`,
        von: 'Flüssige Mittel', nach: 'Zinsaufwand',
        betrag: zinsen, team: teamLabel
      });
      setLS('protokoll', protokoll);
      localStorage.setItem('done_spz30', 'true');
    });
  </script>
</body>
</html>
