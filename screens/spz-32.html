<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kostenreduktion & Abschluss – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body { margin:0; padding:0; min-height:100vh; background:#fff; }
    * { box-sizing:border-box; }

    .page-main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 100px 24px 100px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 48px;
      align-items: start;
    }

    /* ══ Spielaufgabe (linke Spalte) ═════════════════════════════════════ */
    .task-card {
      position: relative;
      border-top:  1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-top-left-radius: 8px;
      padding: 20px 18px 22px;
      background: #fff;
      margin-top: 28px;
    }

    .task-card-icon {
      position: absolute;
      top: -26px; right: 10px;
      height: 48px; width: auto;
    }

    .task-card-title {
      font-weight: 800;
      color: var(--color-accent);
      margin: 0 0 9px;
      font-size: 0.95rem;
    }

    .task-card-text {
      font-size: 0.82rem;
      color: #333;
      line-height: 1.6;
      margin: 0;
    }

    /* ══ Rechte Spalte ════════════════════════════════════════════════════ */
    .right-col { padding-top: 8px; }

    .section-label {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--color-label);
      letter-spacing: 0.01em;
      margin: 0 0 14px;
    }

    .data-list {
      border-top: 1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
      border-radius: 8px 0 0 0;
    }

    .data-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 14px 16px;
      border-bottom: 1px solid var(--color-border-light);
      gap: 16px;
    }
    .data-row:last-child { border-bottom: none; }

    .data-label {
      color: var(--color-accent);
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .data-hint {
      font-size: 0.78rem;
      color: var(--color-label-light);
      margin-top: 3px;
    }

    /* Wert-Badge */
    .val-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 10px;
      min-width: 110px;
      height: 40px;
      padding: 0 18px;
      flex-shrink: 0;
    }

    /* Eingabefeld */
    .data-input {
      width: 110px;
      height: 40px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      outline: none;
      flex-shrink: 0;
    }
    .data-input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 2px rgba(37,117,176,0.12); }
    .data-input::-webkit-inner-spin-button,
    .data-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .data-input[type=number] { -moz-appearance: textfield; appearance: textfield; }

    .section-gap { height: 28px; }
  </style>
</head>

<body
  class="bg-white min-h-screen flex flex-col items-center"
  data-prev="spz-31.html"
  data-next="spz-33.html"
  data-spielzug-label="Spielzug 32"
  data-step-current="32"
  data-step-total="20"
  data-wirkung="00-wirkungen.png"
  data-disable-bank="true"
  data-disable-ereignis="true"
>
  <div id="app-header" class="w-full"></div>

  <main class="w-full flex-1">
    <div class="page-main">

      <!-- Linke Spalte: Spielaufgabe -->
      <aside style="padding-top:28px;">
        <div class="task-card">
          <img id="picto-1" src="../assets/pictos/picto_aufgabe.png" class="task-card-icon" alt="" />
          <h2 class="task-card-title" id="art-1">Spielbrett-Aufgabe</h2>
          <p class="task-card-text" id="text-1"></p>
        </div>
      </aside>

      <!-- Rechte Spalte -->
      <section class="right-col">

        <!-- Variable Kostenreduktion -->
        <p class="section-label" style="margin-top:0;">Variable Kostenreduktion</p>
        <div class="data-list">
          <div class="data-row">
            <div>
              <div class="data-label">Variable Kostenreduktion</div>
              <div class="data-hint">Holen Sie den Betrag bei der Spielleitung ab.</div>
            </div>
            <span class="val-box" id="val-reduktion">–</span>
          </div>
        </div>

        <div class="section-gap"></div>

        <!-- Flüssige Mittel am Ende der Periode -->
        <p class="section-label">Flüssige Mittel am Ende der Periode</p>
        <div class="data-list">
          <div class="data-row">
            <span class="data-label">Flüssige Mittel</span>
            <input id="inp-fluessig" class="data-input" type="number"
                   inputmode="decimal" placeholder="0" min="0" step="1" autocomplete="off" />
          </div>
          <div class="data-row">
            <span class="data-label">Warenvorräte</span>
            <input id="inp-vorraete" class="data-input" type="number"
                   inputmode="decimal" placeholder="0" min="0" step="1" autocomplete="off" />
          </div>
          <div class="data-row">
            <span class="data-label">Aktive Rechnungsabgrenzung</span>
            <span class="val-box" id="val-aktive-ra">–</span>
          </div>
        </div>

      </section>

    </div>
  </main>

  <div id="app-footer" class="w-full bg-transparent"></div>

  <script type="module" src="../assets/js/core.js"></script>

  <script>
    function getLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
    function setLS(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
    function boldQuotes(t) { return (t||'').replace(/"([^"]+)"/g, '<strong>"$1"</strong>'); }
    function toNum(v) { const n = Number(String(v||'').replace(',','.')); return isFinite(n) ? n : 0; }

    /* ══ Spielaufgaben ═══════════════════════════════════════════════════ */
    (function() {
      const data = getLS('spielaufgaben');
      if (!data) return;
      const arr  = data.spielaufgaben || data;
      const item = arr.find(e => e.screenFile === location.pathname.split('/').pop());
      if (!item) return;
      function parseBody(t) {
        const p = (t||'').split('\r');
        return p.length > 1 ? p.slice(1).join(' ').trim() : p[0].trim();
      }
      if (item.AufgabenArt_1) document.getElementById('art-1').textContent = item.AufgabenArt_1;
      document.getElementById('text-1').innerHTML = boldQuotes(parseBody(item.Aufgabe_1));
      if (item.Picto1) document.getElementById('picto-1').src = `../assets/pictos/${item.Picto1.toLowerCase()}`;
    })();

    /* ══ Bilanz-Daten ═════════════════════════════════════════════════════ */
    const bilanzData  = getLS('bilanzStart');
    const bilanzArr   = bilanzData ? (bilanzData.Anfangsbilanz || bilanzData) : null;
    const teamNr      = Number(localStorage.getItem('teamNumber')) || 1;
    const bilanzIdx   = bilanzArr
      ? (bilanzArr[teamNr] !== undefined ? teamNr : (bilanzArr[teamNr-1] !== undefined ? teamNr-1 : 0))
      : 0;
    const bilanzEntry = bilanzArr ? bilanzArr[bilanzIdx] : null;
    const bilanz      = bilanzEntry?.Bilanz || {};

    /* Aktive Rechnungsabgrenzung anzeigen */
    document.getElementById('val-aktive-ra').textContent =
      Number(bilanz.Aktive_Rechnungsabgrenzung) || 0;

    /* ══ Inputs laden + bei jeder Eingabe sofort speichern ═════════════════ */
    (function() {
      const inpF = document.getElementById('inp-fluessig');
      const inpV = document.getElementById('inp-vorraete');

      const saved = getLS('spz32Eingaben') || {};
      if (saved.fluessig !== undefined) inpF.value = saved.fluessig;
      if (saved.vorraete !== undefined) inpV.value = saved.vorraete;

      function save() {
        setLS('spz32Eingaben', {
          fluessig: Math.round(parseFloat(inpF.value) || 0),
          vorraete: Math.round(parseFloat(inpV.value) || 0)
        });
      }
      inpF.addEventListener('input', save);
      inpV.addEventListener('input', save);
      inpF.addEventListener('focus', () => inpF.select());
      inpV.addEventListener('focus', () => inpV.select());
      inpF.addEventListener('keydown', e => { if (e.key === 'Enter') inpF.blur(); });
      inpV.addEventListener('keydown', e => { if (e.key === 'Enter') inpV.blur(); });
    })();

    /* ══ Variable Kostenreduktion berechnen ══════════════════════════════ */
    const er       = getLS('erfolgsrechnung') || {};
    const varKosten = Number(er.Variable_Kosten_Spital) || 0;

    const rawPrj    = getLS('projekte');
    const alleRecs  = rawPrj ? (rawPrj.projekte || rawPrj) : [];
    const entscheid = getLS('projektEntscheide') || {};

    const projektMap = {};
    alleRecs.forEach(r => {
      if (!projektMap[r.projektNr]) projektMap[r.projektNr] = [];
      projektMap[r.projektNr].push(r);
    });

    let kostenReduktion = 0;
    Object.entries(entscheid).forEach(([nr, ent]) => {
      if (!ent.levelKosten) return;
      const records = projektMap[Number(nr)] || [];
      const rec = records.find(r =>
        r.levelKosten === ent.levelKosten && r.levelBezeichnung === ent.levelBezeichnung
      ) || records.find(r => r.levelKosten === ent.levelKosten);
      if (!rec) return;
      const redOpt = (rec.optionen || []).find(o => o.name === 'Variable Kostenreduktion');
      if (redOpt) {
        kostenReduktion += Math.round(varKosten * (Number(redOpt.wert) || 0) / 100);
      }
    });

    document.getElementById('val-reduktion').textContent = kostenReduktion;

    /* ══ Eintritt: Kostenreduktion einmalig in ER + Bilanz buchen ════════ */
    if (localStorage.getItem('done_spz32_eintritt') !== 'true') {
      const teamLabel = localStorage.getItem('klinikName') || `Team ${teamNr}`;

      /* Bilanz: FluessigeMittel += kostenReduktion */
      if (kostenReduktion > 0) {
        const bd = getLS('bilanzStart');
        if (bd) {
          const ba  = bd.Anfangsbilanz || bd;
          const idx = ba[teamNr] !== undefined ? teamNr : (ba[teamNr-1] !== undefined ? teamNr-1 : 0);
          const be  = ba[idx];
          if (be?.Bilanz) {
            be.Bilanz.FluessigeMittel = (Number(be.Bilanz.FluessigeMittel) || 0) + kostenReduktion;
            ba[idx] = be;
            setLS('bilanzStart', bd.Anfangsbilanz ? { ...bd, Anfangsbilanz: ba } : ba);
          }
        }
        const protokoll = getLS('protokoll') || [];
        protokoll.push({
          zeit: new Date().toISOString(), spielzug: 'spz-32',
          aktion: 'Variable Kostenreduktion (von Spielleitung erhalten)',
          von: 'Spielleitung', nach: 'Flüssige Mittel',
          betrag: kostenReduktion, team: teamLabel
        });
        setLS('protokoll', protokoll);
      }

      /* Erfolgsrechnung: Variable Kostenreduktion */
      const erEintritt = getLS('erfolgsrechnung') || {};
      erEintritt.Variable_Kostenreduktion = kostenReduktion;
      setLS('erfolgsrechnung', erEintritt);

      localStorage.setItem('done_spz32_eintritt', 'true');
    }

    /* ══ Verlassen: Eingaben speichern ═══════════════════════════════════ */
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#nav-next')) return;

      const fluessig  = toNum(document.getElementById('inp-fluessig').value);
      const vorraete  = toNum(document.getElementById('inp-vorraete').value);
      const teamLabel = localStorage.getItem('klinikName') || `Team ${teamNr}`;

      setLS('spz32Eingaben', { fluessig, vorraete });

      const protokoll = getLS('protokoll') || [];
      protokoll.push({
        zeit: new Date().toISOString(), spielzug: 'spz-32',
        aktion: 'Periodenschluss: Flüssige Mittel gezählt',
        von: '–', nach: 'Bilanz', betrag: fluessig, team: teamLabel
      });
      protokoll.push({
        zeit: new Date().toISOString(), spielzug: 'spz-32',
        aktion: 'Periodenschluss: Warenvorräte gezählt',
        von: '–', nach: 'Bilanz', betrag: vorraete, team: teamLabel
      });
      setLS('protokoll', protokoll);
    }, true);
  </script>
</body>
</html>
