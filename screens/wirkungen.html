<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wirkungsgefüge – Planspiel Bülach</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../assets/pictos/neosight-192.png" />

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; min-height: 100%;
      background: #fff;
      overflow-x: hidden;
      overflow-y: auto;
    }
    * { box-sizing: border-box; }

    /* ── Fixierte Steuerung oben rechts (im Spielrahmen) ── */
    .controls {
      position: absolute;
      top: 12px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 500;
    }

    .btn-alle {
      display: none;                        /* nur sichtbar wenn Detail angezeigt */
      padding: 0 18px;
      height: 40px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 0.80rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.02em;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(37,117,176,0.35);
      transition: background 0.15s;
    }
    .btn-alle:hover { background: var(--color-accent-dark); }
    .btn-alle.visible {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-close {
      width: 40px;
      height: 40px;
      border-radius: 15%;
      background: rgba(255,255,255,0.92);
      border: 1.5px solid var(--color-border);
      color: var(--color-accent);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-close:hover {
      background: var(--color-accent);
      color: #fff;
      border-color: var(--color-accent);
    }

    /* ── Scrollbarer Bereich (Diagramm), Steuerung bleibt fix im Rahmen ── */
    .scroll-area {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ── Bild-Container ── */
    .img-container {
      position: relative;
      width: 100%;
      display: block;
      line-height: 0;
    }
    .img-container img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Hotspot-Overlay ── */
    .hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent;
      border-radius: 6px;
      transition: background 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: rgba(37,117,176,0.2);
    }
    .hotspot:hover,
    .hotspot:active {
      background: rgba(37, 117, 176, 0.18);
      box-shadow: inset 0 0 0 0px rgba(37,117,176,0.5);
    }
  </style>
</head>
<body>

  <!-- Fixierte Steuerung -->
  <div class="controls">
    <button class="btn-alle" id="btn-alle">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <rect x="0.5" y="0.5" width="5" height="5" rx="1" fill="white" opacity="0.85"/>
        <rect x="8.5" y="0.5" width="5" height="5" rx="1" fill="white" opacity="0.85"/>
        <rect x="0.5" y="8.5" width="5" height="5" rx="1" fill="white" opacity="0.85"/>
        <rect x="8.5" y="8.5" width="5" height="5" rx="1" fill="white" opacity="0.85"/>
      </svg>
      alle
    </button>
    <button class="btn-close" id="btn-close">&times;</button>
  </div>

  <!-- Bild + Hotspots -->
  <div class="scroll-area">
  <div class="img-container" id="img-container">
    <img id="wirkung-img" src="" alt="Wirkungsgefüge" />

    <!--
      Koordinaten als % des Bildbereichs (left / top / width / height).
      Gemessen anhand der vom User markierten Nummerierungs-Übersicht.
      Nur aktiv wenn die Übersicht (00-wirkungen.png) angezeigt wird.
    -->
    <div id="hotspot-layer">

      <!-- 1 – Qualität Küche und Caféteria -->
      <div class="hotspot" data-file="01_qualitaet-kueche.png"
           style="left:6%;  top:47%; width:6%;  height:3%;"></div>

      <!-- 2 – Modernisierung der medizintechnischen Geräte -->
      <div class="hotspot" data-file="02_modern-geraete.png"
           style="left:8%;  top:71.8%;   width:7.5%;  height:4%;"></div>

      <!-- 3 – Nachhaltigkeit -->
      <div class="hotspot" data-file="03_nachhaltigkeit.png"
           style="left:15%;   top:82.7%;   width:7.5%; height:3%;"></div>

      <!-- 4 – Gebäudeinfrastruktur Standort Männedorf -->
      <div class="hotspot" data-file="04_gebaeude-maennedorf.png"
           style="left:17.3%; top:35%;   width:7.8%; height:4.3%;"></div>

      <!-- 5 – Mitarbeitende gewinnen und binden durch Employer Branding -->
      <div class="hotspot" data-file="05_mitarbeiter-gewinnen.png"
           style="left:16.6%; top:49%; width:8.3%; height:4.5%;"></div>

      <!-- 6 – Strategie, Kommunikation und Entwicklung -->
      <div class="hotspot" data-file="06_strategie-kommunikation.png"
           style="left:30.7%;   top:44%; width:8%; height:4.7%;"></div>

      <!-- 7a – Koordination der Patientenaufnahme -->
      <div class="hotspot" data-file="07_pflegeintensitaet.png"
           style="left:32.6%;   top:86%; width:7.2%; height:3.3%;"></div>

      <!-- 7b – Mitarbeitendenplanung -->
      <div class="hotspot" data-file="07_pflegeintensitaet.png"
           style="left:42.5%; top:86.5%; width:8.5%; height:2.1%;"></div>

      <!-- 8 – OP Management -->
      <div class="hotspot" data-file="08_OP-Management.png"
           style="left:44.5%; top:57.3%; width:5%; height:3.3%;"></div>

      <!-- 9 – Spitalhygiene und Reinigung -->
      <div class="hotspot" data-file="09_spitalhygiene.png"
           style="left:42.3%; top:73.9%; width:5.8%;   height:3%;"></div>

      <!-- 10 – Belegarzt Management -->
      <div class="hotspot" data-file="10_Belegarzt.png"
           style="left:50.3%; top:60.9%; width:5.3%; height:3%;"></div>

      <!-- 11 – Investitionen in Radiologie, Intensivmedizin und Anästhesie -->
      <div class="hotspot" data-file="11_Investiton.png"
           style="left:56.5%; top:40.6%; width:8%; height:4.6%;"></div>

      <!-- 12 – Individuelle Mitarbeitendenförderung -->
      <div class="hotspot" data-file="12_individuelle-mitarbeitfoerdereung.png"
           style="left:58%; top:88.7%; width:8%; height:3%;"></div>

      <!-- 13 – Digitalisierung Administration -->
      <div class="hotspot" data-file="13_digitalisierung.png"
           style="left:64%; top:70.5%; width:6.2%; height:3.4%;"></div>

      <!-- 14 – Integrales Kapazitätsmanagement (IKM) -->
      <div class="hotspot" data-file="14_ikm.png"
           style="left:71.3%; top:40.7%; width:8.1%; height:5%;"></div>

      <!-- 15 – Zuweisenden Management -->
      <div class="hotspot" data-file="15_zuweisenden.png"
           style="left:71.5%; top:57.6%; width:6%; height:3.2%;"></div>

      <!-- 16 – Kooperationspartner Management -->
      <div class="hotspot" data-file="16_kooperationspartner.png"
           style="left:78.5%; top:48.6%; width:7.3%; height:5%;"></div>

      <!-- 17 – AKM: Ambulante Klinik Meilen (Pflichtprojekt) -->
      <div class="hotspot" data-file="17_ak-meilen.png"
           style="left:79%; top:72.6%; width:8.6%;  height:4.5%;"></div>

      <!-- 18 – Neues KIS -->
      <div class="hotspot" data-file="18_neues-kis.png"
           style="left:76%; top:87.6%; width:8%;  height:3%;"></div>

    </div>
  </div>
  </div>

  <script>
    /* ── URL-Parameter ── */
    const params    = new URLSearchParams(window.location.search);
    const fromPage  = params.get('from') || '';
    const initFile  = params.get('file') || '00_wirkungen.png';

    const OVERVIEW  = '00_wirkungen.png';
    const BASE      = '../data/wirkungen/';

    const img       = document.getElementById('wirkung-img');
    const layer     = document.getElementById('hotspot-layer');
    const btnAlle   = document.getElementById('btn-alle');
    const btnClose  = document.getElementById('btn-close');

    /* ── Bild wechseln ── */
    function switchImage(file) {
      if (!file) return;                    // Platzhalter ohne Datei: ignorieren
      img.src = BASE + file + '?v=' + Date.now();
      const isOverview = (file === OVERVIEW);
      layer.style.display = isOverview ? 'block' : 'none';
      btnAlle.classList.toggle('visible', !isOverview);
    }

    /* ── Hotspot-Klicks ── */
    layer.querySelectorAll('.hotspot').forEach(el => {
      el.addEventListener('click', () => {
        const file = el.dataset.file;
        if (file) switchImage(file);
      });
    });

    /* ── «alle Wirkungen» → Übersicht ── */
    btnAlle.addEventListener('click', () => switchImage(OVERVIEW));

    /* ── X → zurück zur Ursprungsseite ── */
    btnClose.addEventListener('click', () => {
      if (fromPage) window.location.href = fromPage;
      else          history.back();
    });

    /* ── Init ── */
    switchImage(initFile);
  </script>
</body>
</html>
